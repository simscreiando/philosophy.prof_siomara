    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FORMSPREE_ID = "8ebd68a7-0287-41da-83e8-72aa7fa521b8"; 
        const PROFESSORA_IMAGE = "https://raw.githubusercontent.com/simscreiando/philosophy.prof_siomara/72cd32ed88c92ff78ec2785c4779aacd652d6230/professora.png";

        const CHAPTER_INTRO = {
            1: { title: "O Direito como Objeto Cultural", context: "Você assume o seu gabinete em um momento de transição social. Lembre-se: o Direito não é um fenômeno da natureza, mas uma obra humana. Ele é cultura, valor e história." },
            2: { title: "Moral e Ética no Judiciário", context: "A lei nem sempre caminha ao lado da consciência individual. Agora, você enfrentará dilemas onde a frieza do código encontra o calor dos valores éticos." },
            3: { title: "A Busca pela Justiça Real", context: "O Tribunal exige segurança jurídica, mas o povo clama por Justiça. Seu desafio é equilibrar a estabilidade das instituições com a equidade." },
            4: { title: "Poder, Liberdade e Resistência", context: "O Estado é um gigante que pode proteger ou esmagar. Como consultor(a), você é o limite que garante a liberdade jurídica." },
            5: { title: "Direito, Sanção e Coação", context: "A norma que não se impõe é letra morta. Entramos no campo da coação legítima e organizada necessária para a existência do Direito." }
        };

        const RAW_SCENARIOS = [
            // CAPÍTULO 1
            { ch: 1, title: "Conceito de Direito e Ordenamento Jurídico", text: "Após conflitos sociais sucessivos, grupos políticos passaram a defender que o Direito apenas limita impulsos naturais humanos e que a sociedade deveria organizar-se pela lógica espontânea da força e da sobrevivência. O Tribunal solicita parecer filosófico.", options: [
                { t: "O Direito existe para transformar impulsos naturais em convivência social orientada por valores éticos.", s: 1, i: {leg: 100, seg: 90, lib: 80}, f: "A alternativa compreende corretamente o Direito como objeto cultural destinado à organização racional da convivência humana." },
                { t: "A prevalência natural dos mais fortes constitui fundamento legítimo da ordem jurídica.", s: 0, i: {leg: 20, seg: 30, lib: 10}, f: "A resposta aproxima o Direito de relações puramente biológicas de dominação, afastando sua dimensão ética." },
                { t: "O Direito deve apenas registrar práticas sociais já existentes, sem transformá-las.", s: 0, i: {leg: 40, seg: 70, lib: 40}, f: "A alternativa reconhece a influência social sobre o Direito, mas reduz excessivamente sua função normativa." },
                { t: "Toda forma de regulamentação jurídica compromete necessariamente a liberdade humana.", s: 0, i: {leg: 30, seg: 20, lib: 70}, f: "A resposta ignora que a ausência de normatividade tende a ampliar arbitrariedades e instabilidade social." }
            ]},
            { ch: 1, title: "Legitimidade e Cultura", text: "O governo instituiu normas inspiradas em modelos estrangeiros sem considerar costumes locais historicamente consolidados. Em pouco tempo, cresceram resistência social e descumprimento coletivo das regras impostas.", options: [
                { t: "A eficácia jurídica decorre exclusivamente da capacidade estatal de aplicar sanções.", s: 0, i: {leg: 20, seg: 80, lib: 10}, f: "A resposta reduz o Direito à coerção, ignorando fatores sociais de legitimidade normativa." },
                { t: "A legitimidade do Direito também depende de diálogo com valores culturais compartilhados.", s: 1, i: {leg: 100, seg: 80, lib: 90}, f: "A alternativa reconhece adequadamente a dimensão histórica e cultural da experiência jurídica." },
                { t: "O Direito pode promover mudanças sociais, mas não pode ignorar completamente os valores coletivos.", s: 0.8, i: {leg: 60, seg: 70, lib: 60}, f: "A resposta demonstra compreensão razoável do caráter dinâmico da ordem jurídica, mas não é a mais precisa sobre a essência cultural." },
                { t: "A cultura popular deve ser ignorada sempre que dificultar reformas institucionais modernas.", s: 0, i: {leg: 10, seg: 50, lib: 20}, f: "A alternativa compromete a legitimidade democrática e despreza a historicidade do Direito." }
            ]},
            { ch: 1, title: "Validade da Norma vs. Lei da Natureza", text: "Se uma lei jurídica é violada, ela perde sua validade? Como Nader caracteriza essa situação frente às leis da natureza?", options: [
                { t: "Sim, pois no 'Dever-Ser' a validade da norma depende do seu cumprimento absoluto por todos.", s: 0, i: {leg: 40, seg: 20, lib: 60}, f: "Incorreto. A validade da norma jurídica é independente da sua violação eventual." },
                { t: "Não. A violação apenas aciona a sanção, pois o Direito opera no campo da liberdade e do valor.", s: 1, i: {leg: 100, seg: 100, lib: 80}, f: "Brilhante! Diferente da lei física, a norma jurídica admite ser violada sem deixar de existir." },
                { t: "A lei jurídica, se violada, torna-se uma lei física de causa e efeito imediato.", s: 0, i: {leg: 30, seg: 90, lib: 30}, f: "A sanção não é um efeito físico mecânico, mas uma consequência jurídica prescrita." },
                { t: "A lei jurídica perde a validade se um único indivíduo decidir não obedecê-la.", s: 0, i: {leg: 10, seg: 10, lib: 100}, f: "Isso anularia o Direito. A norma é imperativa e resiste à transgressão." }
            ]},
            { ch: 1, title: "Causalidade vs. Normatividade", text: "Durante audiência pública, um representante afirmou que normas jurídicas funcionam exatamente como leis físicas da natureza, operando de modo automático e inevitável, independentemente de escolhas humanas.", options: [
                { t: "Normas jurídicas e leis naturais possuem a mesma estrutura mecânica e inevitável.", s: 0, i: {leg: 20, seg: 90, lib: 10}, f: "A resposta elimina a dimensão ética e volitiva própria do fenômeno jurídico." },
                { t: "As normas jurídicas pertencem ao campo do dever-ser e pressupõem liberdade e valoração ética.", s: 1, i: {leg: 100, seg: 80, lib: 90}, f: "Correção cirúrgica! A alternativa distingue corretamente causalidade natural e normatividade jurídica." },
                { t: "Embora influenciado pela realidade social, o Direito não se reduz a relações automáticas de causa e efeito.", s: 1, i: {leg: 60, seg: 70, lib: 50}, f: "A alternativa apresenta compreensão da diferença entre natureza e normatividade." },
                { t: "A função do Direito consiste apenas em prever comportamentos humanos recorrentes.", s: 0, i: {leg: 30, seg: 80, lib: 20}, f: "A resposta aproxima o Direito de uma leitura puramente sociológica e desprovida de axiologia." }
            ]},
            { ch: 1, title: "Direito Natural e Positivo", text: "Durante reforma legislativa, surge debate sobre a inclusão de princípios éticos universais no texto constitucional. O Parlamento discute se o Direito deve refletir apenas vontades sociais momentâneas ou também fundamentos permanentes ligados à dignidade e à liberdade humana.", options: [
                { t: "O Direito Natural constitui sistema absoluto e imutável de regras religiosas que impede adaptação histórica do Positivo.", s: 0, i: {leg: 50, seg: 80, lib: 10}, f: "Reconhece a ideia de permanência, mas reduz o Direito Natural a um modelo rígido e dogmático." },
                { t: "Direito Natural e Positivo constituem ordens idênticas, inexistindo margem interpretativa ou função criadora.", s: 0, i: {leg: 40, seg: 70, lib: 20}, f: "Reconhece a aproximação, mas elimina indevidamente a dimensão histórica e técnica da atividade legislativa." },
                { t: "Princípios como liberdade e preservação da vida dependem exclusivamente da vontade política de cada época histórica.", s: 0, i: {leg: 30, seg: 20, lib: 90}, f: "A resposta ignora o caráter universal atribuído aos princípios fundamentais do Direito Natural." },
                { t: "A ordem jurídica deve articular realidade social e princípios universais do Direito Natural, como vida e liberdade.", s: 1, i: {leg: 100, seg: 80, lib: 90}, f: "Compreensão perfeita. O Direito Natural atua como fundamento axiológico orientador da produção normativa positiva." }
            ]},
            { ch: 1, title: "Segurança e Previsibilidade", text: "Um cidadão é processado por conduta moralmente reprovável, mas sem previsão legal clara de sanção. A defesa sustenta que o Direito exige previsibilidade normativa e tipificação objetiva para legitimar o exercício do poder estatal.", options: [
                { t: "O Direito exige predeterminação formal mínima, tipificação e previsibilidade normativa das consequências.", s: 1, i: {leg: 100, seg: 100, lib: 80}, f: "A alternativa compreende corretamente a relação entre bilateralidade atributiva, certeza jurídica e predeterminação formal na teoria de Miguel Reale." },
                { t: "A lei deve refletir os valores da sociedade para ter eficácia e cumprir seu papel adaptativo.", s: 0.5, i: {leg: 70, seg: 50, lib: 60}, f: "A coerência com os valores sociais garante a vida do Direito, mas a defesa exige foco na segurança normativa formal no caso concreto." },
                { t: "A certeza jurídica impede qualquer atividade interpretativa do Poder Judiciário além da literalidade da norma.", s: 0, i: {leg: 40, seg: 90, lib: 10}, f: "Reconhece a importância da previsibilidade, mas reduz excessivamente a função interpretativa da jurisdição." },
                { t: "Sistemas jurídicos baseados em costumes não possuem segurança normativa nem critérios formais de juridicidade.", s: 0, i: {leg: 20, seg: 30, lib: 30}, f: "A resposta ignora que diferentes tradições jurídicas desenvolvem mecanismos próprios de estabilidade." }
            ]},

            // CAPÍTULO 2
            { ch: 2, title: "Foro Íntimo vs. Exterioridade", text: "Na crise, muitos cumprem normas por receio de punição, embora discordem delas. O Tribunal pede análise sobre a relação entre Direito e Moral.", options: [
                { t: "O Direito pode exigir comportamentos externos independente da adesão moral interna do indivíduo.", s: 1, i: {leg: 100, seg: 90, lib: 60}, f: "Excelente! Você compreendeu a coercibilidade e a distinção entre foro íntimo e comportamento exigível." },
                { t: "Normas jurídicas somente são legítimas quando coincidem integralmente com convicções morais individuais.", s: 0, i: {leg: 30, seg: 20, lib: 100}, f: "Cuidado. Isso reduziria a autonomia do Direito diante da pluralidade moral da sociedade." },
                { t: "Direito e Moral possuem exatamente a mesma estrutura coercitiva e mecanismos de imposição.", s: 0, i: {leg: 10, seg: 30, lib: 20}, f: "Incorreto. A alternativa ignora a diferença entre coerção estatal e adesão moral espontânea." },
                { t: "O Direito atua prioritariamente sobre relações externas, enquanto a Moral foca na consciência.", s: 0.5, i: {leg: 70, seg: 60, lib: 60}, f: "Boa análise, embora menos profunda sobre as diferenças estruturais entre as normas de coação. Não é prioritariamente, mas sim direcionado às relações externas" }
            ]},
            { ch: 2, title: "Coercibilidade", text: "Políticos defendem que normas sem aplicação imediata da força não são jurídicas. Qual o parecer correto sobre a coercibilidade do Direito?", options: [
                { t: "A coercibilidade jurídica depende necessariamente da aplicação física imediata da força estatal.", s: 0, i: {leg: 30, seg: 80, lib: 10}, f: "Não. Isso reduz o Direito à violência material, ignorando sua dimensão institucional potencial." },
                { t: "A coercibilidade é a possibilidade legítima de imposição pela força, ainda que não usada concretamente.", s: 1, i: {leg: 100, seg: 100, lib: 80}, f: "Perfeito! A coercibilidade é um elemento potencial e estruturante da juridicidade." },
                { t: "A existência de sanções transforma automaticamente qualquer regra moral em norma jurídica.", s: 0, i: {leg: 20, seg: 40, lib: 30}, f: "Errado. A juridicidade exige institucionalização normativa e reconhecimento pelo Estado." },
                { t: "A força estatal é importante, mas insuficiente para explicar integralmente a experiência jurídica.", s: 0.5, i: {leg: 60, seg: 50, lib: 70}, f: "Correto em essência, mas não responde à natureza específica da coercibilidade jurídica pedida no enunciado." }
            ]},
            { ch: 2, title: "Ética vs. Moral", text: "Debate: Ética seria o social e Moral a reflexão. O Direito seria extensão da Moral. Qual a distinção correta segundo Bittar e Mascaro?", options: [
                { t: "A Moral corresponde às práticas sociais vividas, enquanto a Ética realiza a reflexão crítica.", s: 1, i: {leg: 100, seg: 70, lib: 90}, f: "Exato! Você captou a distinção filosófica clássica trabalhada por Bittar e Mascaro." },
                { t: "Ética e Moral são expressões rigorosamente idênticas, sem qualquer distinção conceitual.", s: 0, i: {leg: 40, seg: 40, lib: 40}, f: "Atenção. A resposta ignora a distinção entre a prática moral e a reflexão ética crítica." },
                { t: "O Direito constitui simples subcategoria da Moral, sem autonomia histórica ou institucional.", s: 0, i: {leg: 20, seg: 30, lib: 20}, f: "Incorreto. Isso elimina a especificidade política e institucional do fenômeno jurídico." },
                { t: "O Direito mantém diálogo com a Moral, mas possui estruturas próprias de normatividade e coação.", s: 1, i: {leg: 80, seg: 80, lib: 70}, f: "Correto conceitualmente, mas a primeira alternativa define melhor a relação Ética vs Moral." }
            ]},
            { ch: 2, title: "Ética Profissional", text: "Um jurista justifica atos abusivos alegando apenas cumprir ordens e preceitos técnicos da lei. Como a ética de Bittar avalia essa postura?", options: [
                { t: "O exercício profissional do Direito exige responsabilidade ética pelos impactos sociais das decisões.", s: 1, i: {leg: 100, seg: 70, lib: 100}, f: "Muito bem! Bittar destaca o compromisso ético-social inafastável do operador jurídico." },
                { t: "O jurista deve preocupar-se exclusivamente com resultados técnicos e estratégicos do sistema.", s: 0, i: {leg: 20, seg: 90, lib: 10}, f: "Péssimo. Essa visão ignora a dimensão humana e ética inerente à atuação jurídica." },
                { t: "A responsabilidade ética existe apenas quando houver violação explícita da legislação positiva.", s: 0, i: {leg: 40, seg: 80, lib: 30}, f: "Cuidado. Isso reduz a ética profissional ao mero cumprimento formal da legalidade cega." },
                { t: "Decisões jurídicas interferem diretamente na vida social, política e axiológica da coletividade.", s: 0.8, i: {leg: 80, seg: 60, lib: 70}, f: "Verdadeiro, mas não é a crítica filosófica direta à postura de obediência cega exigida na questão." }
            ]},
            { ch: 2, title: "Teoria do Mínimo Ético", text: "Empresa demite funcionário por ato imoral, mas juridicamente lícito. Qual a relação entre os campos segundo Miguel Reale?", options: [
                { t: "A teoria do mínimo ético diz que toda regra moral relevante vira automaticamente obrigação jurídica.", s: 0.3, i: {leg: 30, seg: 60, lib: 30}, f: "Incompleto. Isso elimina indevidamente a autonomia estrutural do fenômeno jurídico." },
                { t: "O Direito absorve a moralidade social, não havendo distinção entre ilícito jurídico e reprovação ética.", s: 0, i: {leg: 20, seg: 40, lib: 20}, f: "Errado. Reale defende que são campos distintos com estruturas de sanção diversas." },
                { t: "Nem toda reprovação moral produz consequência jurídica, pois os campos possuem autonomia relativa.", s: 1, i: {leg: 100, seg: 80, lib: 80}, f: "Perfeito! Você compreendeu a crítica ao mínimo ético e a autonomia na teoria de Reale." },
                { t: "A empresa pode impor qualquer dever de foro íntimo se houver previsão em regulamento interno.", s: 0.2, i: {leg: 30, seg: 60, lib: 10}, f: "Parcialmente correto, mas amplia demais o alcance do poder regulamentar sobre a esfera íntima." }
            ]},
            { ch: 2, title: "Função Transformadora", text: "Movimentos defendem o Direito como arma de cidadania. Qual a função transformadora destacada por Bittar e Mascaro?", options: [
                { t: "O Direito pode atuar como instrumento de transformação social comprometido com a justiça.", s: 1, i: {leg: 100, seg: 60, lib: 100}, f: "Excelente! Você captou a função social e democrática defendida pelos autores críticos." },
                { t: "O Direito deve limitar-se à preservação técnica da ordem vigente, sem preocupações sociais.", s: 0, i: {leg: 20, seg: 90, lib: 10}, f: "Incorreto. Isso reduz o Direito à mera manutenção formal do poder instituído." },
                { t: "Questões éticas e sociais pertencem exclusivamente à política, não ao campo jurídico.", s: 0, i: {leg: 30, seg: 50, lib: 30}, f: "Não. A teoria contemporânea reconhece a intensa interação entre esses campos indissociáveis." },
                { t: "A experiência jurídica envolve permanente diálogo entre normas, valores e história.", s: 1, i: {leg: 80, seg: 70, lib: 80}, f: "Correto na teoria tridimensional de Reale, mas a resposta A reflete diretamente a crítica social dos autores." }
            ]},

            // CAPÍTULO 3
            { ch: 3, title: "Justiça Material vs. Formal", text: "Uma decisão legal causou grave desigualdade social. O debate questiona se a conformidade à lei basta para caracterizar a verdadeira justiça.", options: [
                { t: "A legalidade somente preserva legitimidade quando compatível com critérios materiais de justiça.", s: 1, i: {leg: 100, seg: 60, lib: 90}, f: "Excelente! Você compreendeu a tensão entre validade formal e justiça material (conteúdo)." },
                { t: "A Justiça corresponde exclusivamente ao cumprimento literal da legislação positiva.", s: 0, i: {leg: 30, seg: 100, lib: 10}, f: "Incorreto. Isso reduz o Direito ao formalismo puro, ignorando sua dimensão axiológica e humana." },
                { t: "A estabilidade institucional justifica limitações excepcionais à justiça social.", s: 0.2, i: {leg: 60, seg: 80, lib: 30}, f: "Atenção. Você valorizou demais a ordem conservadora em detrimento da realização do justo." },
                { t: "A interpretação exige equilíbrio entre segurança normativa e realização da justiça.", s: 0.8, i: {leg: 80, seg: 70, lib: 80}, f: "Boa resposta. Demonstra compreensão da complexidade contemporânea, mas a letra A ataca o cerne do enunciado." }
            ]},
            { ch: 3, title: "Justiça Distributiva", text: "Em crise econômica, o governo debate como dividir recursos escassos entre grupos desiguais. Qual o critério da justiça distributiva?", options: [
                { t: "A justiça distributiva exige tratar desigualmente os desiguais na medida de suas diferenças.", s: 1, i: {leg: 100, seg: 70, lib: 90}, f: "Perfeito! Você aplicou corretamente a tradição proporcional aristotélica retomada por Bittar." },
                { t: "A igualdade jurídica exige distribuição idêntica de recursos para todos os grupos, ignorando necessidades.", s: 0, i: {leg: 40, seg: 60, lib: 40}, f: "Cuidado. Você confundiu igualdade aritmética ou formal com a verdadeira justiça material." },
                { t: "A distribuição deve obedecer exclusivamente aos interesses econômicos imediatos do Estado.", s: 0, i: {leg: 10, seg: 80, lib: 10}, f: "Errado. A alternativa ignora a finalidade ética e garantista das políticas públicas sociais." },
                { t: "A justiça social depende da consideração das desigualdades historicamente produzidas.", s: 0.8, i: {leg: 80, seg: 60, lib: 80}, f: "Correto, mas a máxima aristotélica exata pedida para a justiça distributiva está na alternativa A." }
            ]},
            { ch: 3, title: "Segurança Jurídica", text: "Mudanças jurisprudenciais contraditórias geram insegurança entre os contribuintes. O que os cidadãos podem exigir do sistema judiciário?", options: [
                { t: "A segurança jurídica exige estabilidade interpretativa mínima e previsibilidade das normas.", s: 1, i: {leg: 100, seg: 100, lib: 80}, f: "Exato! A segurança jurídica preserva a confiança social nas instituições e permite o planejamento." },
                { t: "A busca pela justiça autoriza alterações imprevisíveis e constantes das decisões.", s: 0, i: {leg: 30, seg: 20, lib: 70}, f: "Risco alto. Isso sacrifica a estabilidade institucional e a vida cidadã em nome de um ideal volátil." },
                { t: "A segurança jurídica impede qualquer atualização interpretativa das normas pelo juiz.", s: 0.2, i: {leg: 40, seg: 90, lib: 10}, f: "Parcialmente correto, mas o Direito precisa de uma dinâmica mínima para evoluir socialmente." },
                { t: "A previsibilidade jurídica possui relevância secundária diante dos interesses de arrecadação do Estado.", s: 0, i: {leg: 10, seg: 80, lib: 10}, f: "Incorreto. Isso compromete a confiança necessária à ordem democrática e beira a arbitrariedade." }
            ]},
            { ch: 3, title: "Dignidade Humana e Sistema Punitivo", text: "Corte de gastos em presídios impede assistência médica básica. O debate questiona os limites da pena e da dignidade humana.", options: [
                { t: "A dignidade impede que a pena produza condições degradantes além da privação de liberdade.", s: 1, i: {leg: 100, seg: 60, lib: 100}, f: "Perfeito! A dignidade humana é o limite intransponível e ético do poder punitivo estatal." },
                { t: "A estabilidade financeira do Estado justifica restrições aos direitos fundamentais de presos.", s: 0, i: {leg: 20, seg: 80, lib: 10}, f: "Errado. Direitos fundamentais intrínsecos à vida não podem ser subordinados a planilhas de corte econômico." },
                { t: "O sofrimento adicional nas prisões integra legitimamente a finalidade pedagógica da pena.", s: 0, i: {leg: 10, seg: 90, lib: 0}, f: "Inaceitável. Isso viola os limites constitucionais e humanitários básicos do exercício de poder." },
                { t: "A proteção da dignidade depende de critérios morais e não de deveres jurídicos objetivos constitucionais.", s: 0, i: {leg: 50, seg: 40, lib: 50}, f: "Atenção. Embora tenha base ética profunda, a dignidade impõe um dever jurídico impositivo e concreto." }
            ]},

        const shuffle = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        function App() {
            const [gameState, setGameState] = useState('intro-summary');
            const [introTimer, setIntroTimer] = useState(0);
            const [user, setUser] = useState({ name: '', class: '' });
            const [scenarios, setScenarios] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [metrics, setMetrics] = useState({ leg: 50, seg: 50, lib: 50 });
            const [feedback, setFeedback] = useState(null);
            const [timer, setTimer] = useState(60);
            const [chapterPopup, setChapterPopup] = useState(null);
            
            const hasSent = useRef(false);
            const stateRef = useRef({ score, metrics, user, gameState });

            useEffect(() => { 
                stateRef.current = { score, metrics, user, gameState }; 
            }, [score, metrics, user, gameState]);

            useEffect(() => {
                const sendEmergencyData = () => {
                    if (hasSent.current || stateRef.current.gameState !== 'playing' || !stateRef.current.user.name) return;
                    
                    const finalGrade = (stateRef.current.score / 30 * 5).toFixed(1);
                    const payload = {
                        estudante: stateRef.current.user.name + " (FECHOU ABA/SAIU)",
                        turma: stateRef.current.user.class,
                        nota_final: finalGrade,
                        status: "Interrompido",
                        legitimidade: stateRef.current.metrics.leg.toFixed(0) + "%",
                        seguranca: stateRef.current.metrics.seg.toFixed(0) + "%",
                        liberdade: stateRef.current.metrics.lib.toFixed(0) + "%"
                    };

                    fetch(`https://api.web3forms.com/submit`, {
                        method: 'POST',
                          <input type="hidden" name="access_key" value="8ebd68a7-0287-41da-83e8-72aa7fa521b8">
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        keepalive: true
                    }).catch(console.error);

                    hasSent.current = true;
                };

                window.addEventListener('pagehide', sendEmergencyData);
                window.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') sendEmergencyData();
                });

                return () => {
                    window.removeEventListener('pagehide', sendEmergencyData);
                };
            }, []);

            useEffect(() => {
                let interval;
                if (gameState === 'intro-summary' || gameState === 'intro-rules') {
                    setIntroTimer(0);
                    interval = setInterval(() => setIntroTimer(v => v + 1), 1000);
                }
                return () => clearInterval(interval);
            }, [gameState]);

            const initScenarios = () => {
                let finalSet = [];
                for (let c = 1; c <= 5; c++) {
                    let chapterQuestions = RAW_SCENARIOS.filter(s => s.ch === c);
                    shuffle(chapterQuestions);
                    chapterQuestions = chapterQuestions.map(q => ({
                        ...q,
                        options: shuffle([...q.options])
                    }));
                    finalSet = [...finalSet, ...chapterQuestions];
                }
                setScenarios(finalSet);
                setGameState('playing');
                setChapterPopup(1);
            };

            useEffect(() => {
                if (gameState === 'playing' && !feedback && !chapterPopup) {
                    if (timer <= 0) { handleSelection(0, {leg:40, seg:40, lib:40}, "O tempo esgotou!"); return; }
                    const t = setInterval(() => setTimer(v => v - 1), 1000);
                    return () => clearInterval(t);
                }
            }, [gameState, timer, feedback, chapterPopup]);

            const handleSelection = (points, impacts, feedbackText) => {
                const newScore = score + points;
                const newMetrics = {
                    leg: Math.min(100, Math.max(0, metrics.leg + (impacts.leg - 50) / 4)),
                    seg: Math.min(100, Math.max(0, metrics.seg + (impacts.seg - 50) / 4)),
                    lib: Math.min(100, Math.max(0, metrics.lib + (impacts.lib - 50) / 4)),
                };
                setScore(newScore);
                setMetrics(newMetrics);
                setFeedback(feedbackText);
                setTimeout(() => {
                    setFeedback(null);
                    setTimer(60);
                    if (currentIdx < scenarios.length - 1) {
                        const nextIdx = currentIdx + 1;
                        if (scenarios[nextIdx].ch !== scenarios[currentIdx].ch) setChapterPopup(scenarios[nextIdx].ch);
                        setCurrentIdx(nextIdx);
                    } else { finishGame(newScore, newMetrics); }
                }, 4000);
            };

            const finishGame = async (fScore, fMetrics, status = "Concluído") => {
                if (hasSent.current) return;
                setGameState('sending');
                const finalGrade = (fScore / 30 * 5).toFixed(1);
                try {
                    await                     fetch(`https://api.web3forms.com/submit`, {
                        method: 'POST',
                          <input type="hidden" name="access_key" value="8ebd68a7-0287-41da-83e8-72aa7fa521b8">
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            estudante: user.name,
                            turma: user.class,
                            nota_final: finalGrade,
                            status: status,
                            legitimidade: fMetrics.leg.toFixed(0) + "%",
                            seguranca: fMetrics.seg.toFixed(0) + "%",
                            liberdade: fMetrics.lib.toFixed(0) + "%"
                        })
                    });
                    hasSent.current = true;
                } catch (e) { console.error(e); }
                setGameState('end');
            };

            if (gameState === 'intro-summary') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-10 rounded-[40px] max-w-2xl w-full border-t-4 border-cyan-500 animate-fade text-center">
                        <h1 className="text-3xl font-black mb-6 text-white uppercase tracking-tighter">Resumo da Missão</h1>
                        <p className="text-lg text-slate-300 leading-relaxed mb-10 font-light">
                            Bem-vindo ao Simulador de Dilemas Jurídicos. Neste desafio, você é um(a) <strong>consultor(a) jurídico</strong> diante de situações reais e dilemas filosóficos que moldam a nossa sociedade. Ao longo de 5 capítulos, você enfrentará crises políticas, conflitos éticos e decisões judiciais complexas. Sua missão é aplicar o que foi estudado para encontrar a resposta que melhor equilibra a técnica jurídica, a justiça e a dignidade humana. Cada escolha define o peso da sua balança. Você está pronto para sustentar o Direito?
                        </p>
                        {introTimer >= 3 ? (
                            <button onClick={() => setGameState('intro-rules')} className="bg-cyan-600 hover:bg-cyan-500 px-12 py-5 rounded-2xl font-black text-sm tracking-widest shadow-xl transition-all">AVANÇAR</button>
                        ) : (
                            <div className="text-cyan-500 mono text-xs animate-pulse">AGUARDE... {3 - introTimer}s</div>
                        )}
                    </div>
                </div>
            );

            if (gameState === 'intro-rules') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-10 rounded-[40px] max-w-3xl w-full border-t-4 border-yellow-500 animate-fade overflow-y-auto max-h-[90vh]">
                        <h2 className="text-2xl font-black mb-6 text-white uppercase text-center">Regras do Jogo</h2>
                        <ul className="text-sm text-slate-300 space-y-4 font-light list-disc pl-6 mb-10">
                            <li>Antes de começar, insira seu nome completo e turma. Sem isso, sua participação não poderá ser computada.</li>
                            <li>Você terá apenas uma tentativa. Caso o sistema registre mais de um acesso com o mesmo nome, será validada apenas a primeira pontuação.</li>
                            <li>Separe pelo menos 30 minutos para a realização da atividade.</li>                            
                            <li>O jogo percorre os temas da 2ª etapa (Conceito de Direito, Moral, Ética, Justiça, Segurança, Liberdade, Poder e Sanção).</li>
                            <li>Você tem exatamente 60 segundos para responder a cada pergunta.</li>
                            <li>Se o tempo acabar, a pergunta ficará em branco (zero pontos) e o jogo passará automaticamente para a próxima.</li>
                            <li>Certifique-se de estar em local estável. Quedas de sinal podem prejudicar seu tempo.</li>
                            <li>A atividade só é considerada "concluída" quando você chegar ao final do último capítulo.</li>
                            <li>Se você fechar o navegador ou desistir no meio, sua nota será proporcional ao seu desempenho até aquele momento.</li>
                            <li>Leia as justificativas (feedbacks) após cada resposta! Elas ajudam a fixar o conteúdo.</li>
                        </ul>
                        <div className="text-center">
                            {introTimer >= 10 ? (
                                <button onClick={() => setGameState('registration')} className="bg-yellow-600 hover:bg-yellow-500 px-12 py-5 rounded-2xl font-black text-sm tracking-widest shadow-xl transition-all">ENTENDI AS REGRAS</button>
                            ) : (
                                <div className="text-yellow-500 mono text-xs animate-pulse">LEIA ATENTAMENTE... {10 - introTimer}s</div>
                            )}
                        </div>
                    </div>
                </div>
            );

            if (gameState === 'registration') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-12 rounded-[40px] max-w-md w-full shadow-2xl text-center border-t-4 border-cyan-500 animate-fade">
                        <div className="w-20 h-20 bg-cyan-900/30 rounded-full mx-auto mb-6 flex items-center justify-center border-2 border-cyan-500">
                            <span className="text-3xl text-cyan-400">⚖️</span>
                        </div>
                        <h1 className="text-2xl font-black mb-8 tracking-tighter text-white uppercase">Identificação do(a) Consultor(a) Jurídico</h1>
                        <div className="space-y-3">
                            <input placeholder="NOME COMPLETO" className="w-full bg-black/40 p-4 rounded-2xl border border-white/10 outline-none focus:border-cyan-500 text-sm uppercase mono" onChange={e=>setUser({...user, name: e.target.value})} />
                            <input placeholder="TURMA" className="w-full bg-black/40 p-4 rounded-2xl border border-white/10 outline-none focus:border-cyan-500 text-sm uppercase mono" onChange={e=>setUser({...user, class: e.target.value})} />
                            <button onClick={()=>user.name && user.class && initScenarios()} className="w-full bg-cyan-600 hover:bg-cyan-500 p-5 rounded-2xl font-bold text-sm tracking-widest shadow-xl transition-all">INICIAR CONSULTORIA</button>
                        </div>
                    </div>
                </div>
            );

            if (gameState === 'sending') return (
                <div className="h-screen flex items-center justify-center flex-col gap-6 bg-slate-950">
                    <div className="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                    <div className="mono text-cyan-400 text-xs tracking-[0.4em] animate-pulse">PROTOCOLANDO RESULTADOS...</div>
                </div>
            );

            if (gameState === 'end') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-12 rounded-[50px] max-w-xl text-center border-t-8 border-green-500 animate-fade">
                        <h2 className="text-4xl font-black mb-6 text-white tracking-tighter uppercase">Laudo Final</h2>
                        <div className="grid grid-cols-3 gap-3 mb-8">
                            <StatCard label="Legitimidade" val={metrics.leg} color="text-blue-400" />
                            <StatCard label="Segurança" val={metrics.seg} color="text-yellow-400" />
                            <StatCard label="Liberdade" val={metrics.lib} color="text-green-400" />
                        </div>
                        <div className="p-10 bg-cyan-500/10 rounded-[40px] border border-cyan-500/30">
                            <div className="text-[10px] text-cyan-500 uppercase font-black tracking-widest mb-2">Nota Final</div>
                            <div className="text-8xl font-black text-white">{(score / 30 * 5).toFixed(1)}<span className="text-2xl opacity-20">/5.0</span></div>
                        </div>
                        <p className="mt-8 text-[10px] text-slate-500 mono uppercase tracking-widest">Consultor(a) {user.name} - Turma {user.class}</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col max-w-6xl mx-auto relative">
                    {chapterPopup && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
                            <div className="glass p-10 rounded-[45px] max-w-2xl w-full border-b-4 border-cyan-500 animate-fade text-center">
                                <span className="text-cyan-500 mono text-[10px] font-black tracking-widest uppercase mb-4 block">Capítulo {chapterPopup}</span>
                                <h2 className="text-3xl font-black text-white mb-6 uppercase">{CHAPTER_INTRO[chapterPopup].title}</h2>
                                <p className="text-lg text-slate-300 leading-relaxed mb-10 italic">"{CHAPTER_INTRO[chapterPopup].context}"</p>
                                <button onClick={() => setChapterPopup(null)} className="bg-white text-black px-10 py-5 rounded-2xl font-black text-sm tracking-widest hover:bg-cyan-400 transition-all uppercase">Acessar Gabinete</button>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-3 mb-8">
                        <MetricBar label="Legitimidade" val={metrics.leg} color="bg-blue-500" />
                        <MetricBar label="Segurança" val={metrics.seg} color="bg-yellow-500" />
                        <MetricBar label="Liberdade" val={metrics.lib} color="bg-green-500" />
                    </div>

                    {scenarios[currentIdx] && (
                        <div className="flex-1 grid lg:grid-cols-12 gap-8 items-stretch">
                            <div className="glass p-8 md:p-12 rounded-[40px] lg:col-span-8 flex flex-col shadow-2xl relative overflow-hidden">
                                <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                                    <div>
                                        <span className="bg-cyan-500 text-black text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-widest mr-2">Capítulo {scenarios[currentIdx].ch}</span>
                                        <span className="text-white/40 text-[9px] uppercase mono">Dilema {currentIdx + 1}/{scenarios.length}</span>
                                        <h3 className="text-xl font-black text-white mt-2 tracking-tight uppercase italic">{scenarios[currentIdx].title}</h3>
                                    </div>
                                    <div className={`text-4xl font-black mono ${timer < 10 ? 'text-red-500 animate-pulse' : 'text-slate-800'}`}>{timer}s</div>
                                </div>
                                <p className="text-lg text-slate-300 leading-relaxed mb-12 font-light">{scenarios[currentIdx].text}</p>
                                <div className="grid gap-3 mt-auto">
                                    {scenarios[currentIdx].options.map((opt, i) => (
                                        <button 
                                            key={`${currentIdx}-${i}`} 
                                            disabled={!!feedback || !!chapterPopup} 
                                            onClick={(e) => { e.currentTarget.blur(); handleSelection(opt.s, opt.i, opt.f); }}
                                            className="text-left p-5 rounded-2xl border border-white/10 bg-white/5 hover:bg-cyan-500/10 hover:border-cyan-500 transition-all group flex items-center disabled:opacity-50">
                                            <span className="w-10 h-10 rounded-xl bg-black flex items-center justify-center mr-6 text-cyan-500 font-black group-hover:bg-cyan-500 group-hover:text-white transition-all">{String.fromCharCode(65+i)}</span>
                                            <span className="flex-1 text-sm font-bold text-slate-200">{opt.t}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="lg:col-span-4 flex flex-col items-center justify-center gap-6">
                                <div className="w-full glass p-6 rounded-[35px] border-l-4 border-cyan-500">
                                    <p className="text-[10px] text-slate-500 uppercase font-black mb-2 tracking-widest">Gabinete de Consultoria</p>
                                    <p className="text-sm font-bold text-white uppercase truncate">{user.name}</p>
                                    <div className="mt-4 h-1 bg-white/10 rounded-full overflow-hidden">
                                        <div className="h-full bg-cyan-500 rounded-full transition-all" style={{width: `${(currentIdx/30)*100}%`}}></div>
                                    </div>
                                    <button 
                                        onClick={() => confirm("Deseja emitir o laudo parcial agora e encerrar?") && finishGame(score, metrics, "Desistência")}
                                        className="mt-6 w-full py-2 rounded-xl text-[10px] font-black tracking-widest border border-red-500/30 text-red-500 hover:bg-red-500 hover:text-white transition-all uppercase"
                                    >
                                        Desistir / Sair
                                    </button>
                                </div>
                                <div className="flex flex-col items-center min-h-[300px] justify-end">
                                    {feedback && <div className="speech-bubble mb-6 animate-fade">{feedback}</div>}
                                    <div className="relative">
                                        <img src={PROFESSORA_IMAGE} className="prof-avatar shadow-[0_0_40px_rgba(6,182,212,0.3)]" />
                                        <div className="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-4 border-slate-900 rounded-full"></div>
                                    </div>
                                    <p className="mt-4 text-[10px] font-black text-cyan-500 uppercase tracking-[0.3em]">Prof. Siomara</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function MetricBar({ label, val, color }) {
            return (
                <div className="glass p-5 rounded-[25px]">
                    <div className="flex justify-between text-[9px] uppercase font-black tracking-widest mb-3 opacity-50">
                        <span>{label}</span>
                        <span className="mono">{val.toFixed(0)}%</span>
                    </div>
                    <div className="h-1 bg-white/5 rounded-full overflow-hidden">
                        <div className={`h-full ${color} bar-transition`} style={{ width: `${val}%` }}></div>
                    </div>
                </div>
            );
        }

        function StatCard({ label, val, color }) {
            return (
                <div className="p-4 bg-white/5 rounded-3xl border border-white/5">
                    <div className="text-[9px] text-slate-500 uppercase mb-1 font-bold">{label}</div>
                    <div className={`text-2xl font-black ${color}`}>{val.toFixed(0)}%</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

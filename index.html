<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magistratura de Crise: O Legado</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .prof-avatar { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #06b6d4; object-fit: cover; background: #1e293b; }
        .speech-bubble { background: white; color: #1e293b; border-radius: 20px; padding: 15px; position: relative; max-width: 280px; font-size: 0.85rem; font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #06b6d4; }
        .speech-bubble::after { content: ''; position: absolute; bottom: -12px; left: 50%; width: 0; height: 0; border: 12px solid transparent; border-top-color: white; transform: translateX(-50%); }
        .no-select { user-select: none; -webkit-user-select: none; }
        .bar-transition { transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s ease-out forwards; }
    </style>
</head>
<body class="no-select" oncontextmenu="return false;" oncopy="return false;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // CONFIGURAÇÕES
        const FORMSPREE_ID = "xzdoopyw"; 
        // Link RAW extraído do seu repositório para funcionar no HTML:
        const PROFESSORA_IMAGE = "https://raw.githubusercontent.com/simscreiando/philosophy.prof_siomara/72cd32ed88c92ff78ec2785c4779aacd652d6230/professora.png";

        const ALL_SCENARIOS = [
            // CAPÍTULO 1: O COLAPSO DA ORDEM (Paulo Nader)
            { ch: 1, seg: 1, title: "Cultura e Natureza", text: "O povo questiona: 'Por que obedecer leis se a natureza é livre?'. Segundo Paulo Nader, o Direito é um objeto de cultura. Como você responde?", options: [
                { t: "O Direito adapta a natureza aos fins humanos e valores éticos.", s: 0.16, i: {leg: 80, seg: 70, lib: 60}, f: "Correto! O Direito é o que o homem acrescenta à natureza." },
                { t: "O Direito deve apenas copiar as leis biológicas da sobrevivência.", s: 0.05, i: {leg: 30, seg: 90, lib: 20}, f: "Isso seria o retorno à barbárie. Nader discordaria." }
            ]},
            { ch: 1, seg: 2, title: "O Valor da Norma", text: "Um novo decreto ignora os costumes locais. O Direito como cultura pode ignorar os valores de um povo?", options: [
                { t: "Não. A norma jurídica deve ser a expressão dos valores culturais.", s: 0.16, i: {leg: 90, seg: 50, lib: 80}, f: "Exato! Sem valor, a norma é apenas força vazia." },
                { t: "Sim, o Direito é técnica pura e independente da cultura.", s: 0.05, i: {leg: 20, seg: 100, lib: 10}, f: "Isso gera resistência social e falta de legitimidade." }
            ]},
            { ch: 1, seg: 3, title: "A Meta Optata", text: "Qual o alvo final (Meta Optata) que o Direito busca como objeto cultural?", options: [
                { t: "A realização da Justiça.", s: 0.16, i: {leg: 100, seg: 60, lib: 70}, f: "A Justiça é o alvo supremo do Direito como cultura." },
                { t: "A manutenção do status quo governamental.", s: 0, i: {leg: 10, seg: 90, lib: 10}, f: "Isso é política de dominação, não Filosofia do Direito." }
            ]},
            { ch: 1, seg: 4, title: "O Objeto Ideal", text: "As leis são apenas papéis ou são ideias que moldam a realidade social?", options: [
                { t: "São objetos culturais que dão sentido à vida social.", s: 0.16, i: {leg: 80, seg: 80, lib: 60}, f: "Muito bem! O Direito dá forma e sentido à coexistência." },
                { t: "São apenas ferramentas de controle físico.", s: 0.05, i: {leg: 40, seg: 90, lib: 30}, f: "Visão muito limitada. O Direito é mais do que força." }
            ]},
            { ch: 1, seg: 5, title: "A Mudança Social", text: "Um costume antigo tornou-se ofensivo para a sociedade atual. O que fazer com a lei?", options: [
                { t: "Revogar: O Direito deve evoluir com a cultura.", s: 0.16, i: {leg: 90, seg: 40, lib: 90}, f: "O Direito é dinâmico, como a própria cultura humana." },
                { t: "Manter: A tradição é superior à vontade presente.", s: 0.08, i: {leg: 50, seg: 100, lib: 20}, f: "Tradição é importante, mas o anacronismo gera injustiça." }
            ]},
            { ch: 1, seg: 6, title: "Dever-Ser", text: "Qual a diferença fundamental entre uma lei física e uma lei jurídica?", options: [
                { t: "A jurídica busca o 'dever-ser' baseado em valores.", s: 0.20, i: {leg: 100, seg: 70, lib: 70}, f: "Perfeito! O Direito trabalha no campo da liberdade e ética." },
                { t: "Não há diferença, ambas são leis mecânicas.", s: 0, i: {leg: 20, seg: 20, lib: 20}, f: "Incorreto. Na natureza não há escolha; no Direito, há dever." }
            ]},

            // CAPÍTULO 2: MORAL E DIREITO (Miguel Reale)
            { ch: 2, seg: 1, title: "Coercibilidade", text: "Miguel Reale afirma que o Direito possui algo que a Moral não tem. O que seria?", options: [
                { t: "Coercibilidade (possibilidade de uso da força).", s: 0.16, i: {leg: 60, seg: 100, lib: 40}, f: "Isso! O Direito pode ser imposto, a Moral é espontânea." },
                { t: "Espontaneidade interna absoluta.", s: 0, i: {leg: 40, seg: 10, lib: 90}, f: "Não, isso é característica da Moral, segundo Reale." }
            ]},
            { ch: 2, seg: 2, title: "Bilateralidade Atributiva", text: "Como Reale define a estrutura que une dois lados atribuindo poder e dever?", options: [
                { t: "Bilateralidade Atributiva.", s: 0.16, i: {leg: 80, seg: 80, lib: 60}, f: "Exato! É a estrutura básica da relação jurídica." },
                { t: "Unilateralidade subjetiva.", s: 0, i: {leg: 50, seg: 50, lib: 50}, f: "Incorreto. O Direito sempre envolve a relação com o outro." }
            ]},
            { ch: 2, seg: 3, title: "Ação Externa", text: "Um homem ajuda um idoso apenas por medo da multa. Para o Direito, isso basta?", options: [
                { t: "Sim, o Direito foca no cumprimento externo da norma.", s: 0.16, i: {leg: 70, seg: 90, lib: 50}, f: "Correto. A intenção interna é o reino da Moral." },
                { t: "Não, o Direito exige que ele ame o próximo.", s: 0.05, i: {leg: 80, seg: 30, lib: 70}, f: "Isso seria invadir o foro íntimo, o que Reale evita." }
            ]},
            { ch: 2, seg: 4, title: "Possibilidade Lógica", text: "Se não há polícia para fiscalizar uma lei agora, ela deixa de ser coercível?", options: [
                { t: "Não, a coercibilidade é uma possibilidade lógica de força.", s: 0.16, i: {leg: 60, seg: 100, lib: 50}, f: "Brilhante! A força é latente, não precisa ser imediata." },
                { t: "Sim, sem aplicação instantânea não existe Direito.", s: 0, i: {leg: 30, seg: 20, lib: 30}, f: "Confundiu eficácia social com a natureza da norma." }
            ]},
            { ch: 2, seg: 5, title: "Monopólio da Coação", text: "Quem detém o poder legítimo de aplicar a coação no Direito moderno?", options: [
                { t: "O Estado, de forma organizada.", s: 0.16, i: {leg: 70, seg: 100, lib: 30}, f: "Isso garante que a vingança privada não domine." },
                { t: "Qualquer cidadão que se sinta injustiçado.", s: 0, i: {leg: 10, seg: 10, lib: 10}, f: "Isso geraria o caos social e o fim do Direito." }
            ]},
            { ch: 2, seg: 6, title: "Direito e Força", text: "Qual a síntese da relação entre Direito e Força para Reale?", options: [
                { t: "O Direito não é força, mas é força a serviço da Justiça.", s: 0.20, i: {leg: 100, seg: 80, lib: 70}, f: "Excelente! A força é o instrumento, a Justiça é o fim." },
                { t: "O Direito é puramente a força do mais forte.", s: 0, i: {leg: 0, seg: 100, lib: 0}, f: "Visão sofista, superada pela Teoria Tridimensional." }
            ]},

            // CAPÍTULO 3: JUSTIÇA E VONTADE (Eduardo Bittar)
            { ch: 3, seg: 1, title: "A Intencionalidade", text: "Eduardo Bittar discute a vontade. Um ato sem intenção livre pode ser considerado ético?", options: [
                { t: "Não, a ética exige o livre-arbítrio da vontade.", s: 0.16, i: {leg: 90, seg: 50, lib: 90}, f: "Exato! Sem liberdade de escolha, não há responsabilidade." },
                { t: "Sim, apenas o resultado importa na ética.", s: 0, i: {leg: 40, seg: 80, lib: 30}, f: "Isso seria utilitarismo cego, Bittar foca na consciência." }
            ]},
            { ch: 3, seg: 2, title: "A Virtude da Justiça", text: "Para Bittar, a justiça é uma construção constante ou um objeto pronto?", options: [
                { t: "Uma construção social baseada na alteridade.", s: 0.16, i: {leg: 100, seg: 60, lib: 80}, f: "Correto. Justiça se faz olhando para o outro." },
                { t: "Um conceito estático definido para sempre.", s: 0.05, i: {leg: 40, seg: 90, lib: 20}, f: "A justiça é histórica e humana, ela pulsa com a sociedade." }
            ]},
            { ch: 3, seg: 3, title: "O Outro no Direito", text: "Qual a importância da 'Alteridade' no julgamento de um conflito?", options: [
                { t: "É essencial reconhecer o outro como sujeito de direitos.", s: 0.16, i: {leg: 95, seg: 60, lib: 90}, f: "Sem o outro, não há necessidade de Direito." },
                { t: "Nenhuma, o juiz deve olhar apenas para o código.", s: 0, i: {leg: 20, seg: 100, lib: 10}, f: "O código é o mapa, mas o outro é o destino da justiça." }
            ]},
            { ch: 3, seg: 4, title: "Vontade Corrompida", text: "Se um réu é coagido a confessar, como a Filosofia do Direito vê esse ato?", options: [
                { t: "Inexistente como ato ético, pois falta liberdade.", s: 0.16, i: {leg: 90, seg: 40, lib: 100}, f: "Perfeito. O Direito protege a integridade da vontade." },
                { t: "Válido, pois a ordem pública exige resultados.", s: 0, i: {leg: 10, seg: 90, lib: 0}, f: "Isso fere os direitos fundamentais e a ética jurídica." }
            ]},
            { ch: 3, seg: 5, title: "Justiça Distributiva", text: "Ao decidir sobre recursos públicos, você aplica a regra de tratar desiguais na medida de sua desigualdade. Isso é:", options: [
                { t: "Justiça Distributiva (Aristóteles/Bittar).", s: 0.16, i: {leg: 90, seg: 60, lib: 80}, f: "Correto! É a justiça que busca o equilíbrio social." },
                { t: "Justiça Vingativa.", s: 0, i: {leg: 10, seg: 80, lib: 10}, f: "Longe disso. A vingança é o oposto da justiça jurídica." }
            ]},
            { ch: 3, seg: 6, title: "Síntese do Capítulo III", text: "Qual o papel do jurista frente à injustiça da lei?", options: [
                { t: "Ser um crítico e buscar a justiça além da norma posta.", s: 0.20, i: {leg: 100, seg: 50, lib: 90}, f: "Excelente! Bittar propõe um jurista comprometido com a ética." },
                { t: "Ser um escravo da lei, mesmo que ela seja injusta.", s: 0, i: {leg: 20, seg: 90, lib: 10}, f: "Isso é legalismo acrítico, perigoso para a democracia." }
            ]},

            // CAPÍTULO 4: LIBERDADE E RAZÃO (Kant e a Ação)
            { ch: 4, seg: 1, title: "Imperativo Categórico", text: "Você deve criar uma regra para o tribunal. Kant diria: 'Aja de modo que sua regra possa virar...'", options: [
                { t: "Uma Lei Universal.", s: 0.16, i: {leg: 100, seg: 80, lib: 80}, f: "Exato! Essa é a base da ética kantiana." },
                { t: "Uma vantagem para o seu grupo.", s: 0, i: {leg: 10, seg: 50, lib: 20}, f: "Isso seria agir por interesse, não por dever." }
            ]},
            { ch: 4, seg: 2, title: "Autonomia vs Heteronomia", text: "A Moral é autônoma (vem de dentro). O Direito é o que para Kant?", options: [
                { t: "Heterônomo (vem de uma autoridade externa).", s: 0.16, i: {leg: 70, seg: 90, lib: 60}, f: "Correto! O Estado dita a regra externa." },
                { t: "Autônomo também.", s: 0, i: {leg: 40, seg: 40, lib: 90}, f: "Incorreto. O Direito exige obediência externa, independente do querer." }
            ]},
            { ch: 4, seg: 3, title: "O Fim em Si Mesmo", text: "Ao julgar, você pode usar um ser humano como 'exemplo' para assustar os outros?", options: [
                { t: "Não. O ser humano é um fim em si mesmo.", s: 0.16, i: {leg: 100, seg: 40, lib: 100}, f: "Dignidade da Pessoa Humana! Kant ficaria orgulhoso." },
                { t: "Sim, o importante é o medo na sociedade.", s: 0, i: {leg: 20, seg: 100, lib: 10}, f: "Isso viola a dignidade humana. Nunca use pessoas como meios." }
            ]},
            { ch: 4, seg: 4, title: "Liberdade Externa", text: "Para Kant, o Direito serve para compatibilizar a sua liberdade com a do outro?", options: [
                { t: "Sim, é o limite da liberdade externa de todos.", s: 0.16, i: {leg: 90, seg: 80, lib: 90}, f: "Perfeito! Minha liberdade acaba onde começa a sua." },
                { t: "Não, o Direito serve para anular a liberdade.", s: 0, i: {leg: 10, seg: 100, lib: 0}, f: "O Direito sem liberdade é apenas opressão." }
            ]},
            { ch: 4, seg: 5, title: "O Dever de Agir", text: "Um juiz deve seguir a lei por medo da punição ou por respeito ao dever?", options: [
                { t: "Por respeito ao dever racional.", s: 0.16, i: {leg: 100, seg: 70, lib: 70}, f: "Ética do Dever. A razão guia a vontade boa." },
                { t: "Pelo salário no fim do mês.", s: 0, i: {leg: 30, seg: 50, lib: 30}, f: "Isso é pragmatismo, não é o agir ético kantiano." }
            ]},
            { ch: 4, seg: 6, title: "Síntese do Capítulo IV", text: "O que define um ato jurídico justo em Kant?", options: [
                { t: "Aquele que permite a coexistência de arbítrios livres.", s: 0.20, i: {leg: 100, seg: 90, lib: 100}, f: "Excelente! A paz jurídica é a harmonia das liberdades." },
                { t: "Aquele que dá lucro ao Estado.", s: 0, i: {leg: 20, seg: 60, lib: 20}, f: "Visão econômica, não jurídica de Kant." }
            ]},

            // CAPÍTULO 5: TÉCNICA E COERÇÃO (Tércio Sampaio / Gusmão)
            { ch: 5, seg: 1, title: "A Linguagem do Direito", text: "Tércio Sampaio diz que o Direito é um sistema de comunicação. Qual o seu objetivo?", options: [
                { t: "Decidir conflitos e reduzir incertezas.", s: 0.16, i: {leg: 70, seg: 100, lib: 60}, f: "Exato! O Direito traz previsibilidade para a vida." },
                { t: "Confundir as pessoas com palavras difíceis.", s: 0, i: {leg: 10, seg: 10, lib: 10}, f: "Isso é burocratismo patológico, não a função do Direito." }
            ]},
            { ch: 5, seg: 2, title: "Gusmão e a Sanção", text: "Paulo Dourado de Gusmão foca na sanção. O que acontece com a norma sem sanção?", options: [
                { t: "Perde sua força de garantia social.", s: 0.16, i: {leg: 50, seg: 100, lib: 40}, f: "Correto. A sanção é a garantia da ordem." },
                { t: "Fica mais bonita e poética.", s: 0, i: {leg: 20, seg: 10, lib: 80}, f: "Poesia não resolve conflitos de posse ou família." }
            ]},
            { ch: 5, seg: 3, title: "Zetética vs Dogmática", text: "Tércio diferencia o pensar (Zetética) do decidir (Dogmática). O juiz na hora da sentença atua na:", options: [
                { t: "Dogmática (precisa decidir e pôr fim à dúvida).", s: 0.16, i: {leg: 80, seg: 100, lib: 50}, f: "Isso! O tribunal é lugar de decisão, não de dúvida infinita." },
                { t: "Zetética (pode ficar apenas questionando sem decidir).", s: 0, i: {leg: 60, seg: 20, lib: 90}, f: "Se o juiz não decide, ele nega a jurisdição." }
            ]},
            { ch: 5, seg: 4, title: "A Coação Psicológica", text: "A lei funciona apenas quando o policial aparece ou ela já atua no pensamento?", options: [
                { t: "Atua como coação psicológica e temor reverencial.", s: 0.16, i: {leg: 70, seg: 90, lib: 60}, f: "Sim! O Direito molda o comportamento pelo receio da sanção." },
                { t: "Só funciona se houver agressão física.", s: 0, i: {leg: 10, seg: 100, lib: 10}, f: "Isso seria o estado de guerra, não de Direito." }
            ]},
            { ch: 5, seg: 5, title: "Justiça e Tecnologia", text: "O uso de I.A. no Direito deve seguir qual critério de Tércio Sampaio?", options: [
                { t: "A técnica deve servir ao humano e à decidibilidade.", s: 0.16, i: {leg: 80, seg: 90, lib: 80}, f: "Correto. A técnica é meio, a justiça é o sentido." },
                { t: "A I.A. deve substituir a moral humana totalmente.", s: 0, i: {leg: 0, seg: 100, lib: 0}, f: "Isso seria o fim da Filosofia do Direito." }
            ]},
            { ch: 5, seg: 6, title: "O Grande Final", text: "Para concluir sua jornada: O Direito é um sistema fechado ou aberto à vida?", options: [
                { t: "Um sistema que se abre aos valores sociais para ser justo.", s: 0.20, i: {leg: 100, seg: 100, lib: 100}, f: "Perfeito! Você se formou com honras na Magistratura de Crise!" },
                { t: "Um labirinto sem saída de papel e carimbos.", s: 0, i: {leg: 0, seg: 0, lib: 0}, f: "Infelizmente, você se perdeu na burocracia. Tente novamente." }
            ]},
        ];

        function App() {
            const [gameState, setGameState] = useState('intro');
            const [user, setUser] = useState({ name: '', class: '' });
            const [currentIdx, setCurrentIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [metrics, setMetrics] = useState({ leg: 50, seg: 50, lib: 50 });
            const [feedback, setFeedback] = useState(null);
            const [timer, setTimer] = useState(60);

            useEffect(() => {
                if (gameState === 'playing' && !feedback) {
                    if (timer <= 0) { handleSelection(0, {leg:-5, seg:-5, lib:-5}, "O tempo esgotou! O silêncio do juiz é uma decisão por omissão."); return; }
                    const t = setInterval(() => setTimer(v => v - 1), 1000);
                    return () => clearInterval(t);
                }
            }, [gameState, timer, feedback]);

            const handleSelection = (points, impacts, feedbackText) => {
                const newScore = score + points;
                const newMetrics = {
                    leg: Math.min(100, Math.max(0, metrics.leg + (impacts.leg - 50) / 4)),
                    seg: Math.min(100, Math.max(0, metrics.seg + (impacts.seg - 50) / 4)),
                    lib: Math.min(100, Math.max(0, metrics.lib + (impacts.lib - 50) / 4)),
                };

                setScore(newScore);
                setMetrics(newMetrics);
                setFeedback(feedbackText);
                
                setTimeout(() => {
                    setFeedback(null);
                    setTimer(60);
                    if (currentIdx < ALL_SCENARIOS.length - 1) {
                        setCurrentIdx(i => i + 1);
                    } else {
                        finishGame(newScore, newMetrics);
                    }
                }, 4000);
            };

            const finishGame = async (finalScore, finalMetrics) => {
                setGameState('sending');
                const payload = {
                    estudante: user.name,
                    turma: user.class,
                    nota_final: finalScore.toFixed(1),
                    legitimidade: finalMetrics.leg.toFixed(0) + "%",
                    seguranca: finalMetrics.seg.toFixed(0) + "%",
                    liberdade: finalMetrics.lib.toFixed(0) + "%"
                };

                try {
                    await fetch(`https://formspree.io/f/xzdoopyw`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) { console.error(e); }
                setGameState('end');
            };

            if (gameState === 'intro') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-12 rounded-[40px] max-w-md w-full shadow-2xl text-center border-t-4 border-cyan-500">
                        <div className="w-24 h-24 bg-cyan-900/30 rounded-full mx-auto mb-6 flex items-center justify-center border-2 border-cyan-500 shadow-[0_0_20px_#06b6d4]">
                            <span className="text-4xl text-cyan-400 font-black">⚖️</span>
                        </div>
                        <h1 className="text-3xl font-black mb-2 tracking-tighter text-white">MAGISTRATURA DE CRISE</h1>
                        <p className="text-cyan-400 mono text-[10px] mb-8 uppercase tracking-[0.3em]">Ambiente Simulado / Prof. Siomara</p>
                        <div className="space-y-3">
                            <input placeholder="NOME COMPLETO" className="w-full bg-black/40 p-4 rounded-2xl border border-white/10 outline-none focus:border-cyan-500 transition-all text-sm uppercase mono" onChange={e=>setUser({...user, name: e.target.value})} />
                            <input placeholder="TURMA" className="w-full bg-black/40 p-4 rounded-2xl border border-white/10 outline-none focus:border-cyan-500 transition-all text-sm uppercase mono" onChange={e=>setUser({...user, class: e.target.value})} />
                            <button onClick={()=>user.name && user.class && setGameState('playing')} className="w-full bg-cyan-600 hover:bg-cyan-500 p-5 rounded-2xl font-bold text-sm tracking-widest shadow-xl transition-all active:scale-95">INICIAR SIMULAÇÃO</button>
                        </div>
                    </div>
                </div>
            );

            if (gameState === 'sending') return (
                <div className="h-screen flex items-center justify-center flex-col gap-6 bg-slate-950">
                    <div className="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                    <div className="mono text-cyan-400 text-xs tracking-[0.4em] animate-pulse">PROTOCOLANDO RESULTADOS NO TRIBUNAL...</div>
                </div>
            );

            if (gameState === 'end') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-12 rounded-[50px] max-w-xl text-center border-t-8 border-green-500">
                        <h2 className="text-4xl font-black mb-6 text-white uppercase tracking-tighter">Veredito Arquivado</h2>
                        <div className="grid grid-cols-3 gap-3 mb-8">
                            <StatCard label="Legitimidade" val={metrics.leg} color="text-blue-400" />
                            <StatCard label="Segurança" val={metrics.seg} color="text-yellow-400" />
                            <StatCard label="Liberdade" val={metrics.lib} color="text-green-400" />
                        </div>
                        <div className="p-10 bg-cyan-500/10 rounded-[40px] border border-cyan-500/30">
                            <div className="text-[10px] text-cyan-500 uppercase font-black tracking-widest mb-2">Nota Final de Desempenho</div>
                            <div className="text-8xl font-black text-white">{score.toFixed(1)}<span className="text-2xl opacity-20">/5.0</span></div>
                        </div>
                        <p className="mt-8 text-xs text-slate-500 mono uppercase">Magistrado(a) {user.name} - Turma {user.class}</p>
                    </div>
                </div>
            );

            const current = ALL_SCENARIOS[currentIdx];

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col max-w-6xl mx-auto">
                    <div className="grid grid-cols-3 gap-3 mb-8">
                        <MetricBar label="Legitimidade" val={metrics.leg} color="bg-blue-500" />
                        <MetricBar label="Segurança" val={metrics.seg} color="bg-yellow-500" />
                        <MetricBar label="Liberdade" val={metrics.lib} color="bg-green-500" />
                    </div>

                    <div className="flex-1 grid lg:grid-cols-12 gap-8 items-stretch">
                        <div className="glass p-8 md:p-12 rounded-[40px] lg:col-span-8 flex flex-col shadow-2xl relative overflow-hidden">
                            <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                                <div>
                                    <span className="bg-cyan-500 text-black text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-widest mr-2">Capítulo {current.ch}</span>
                                    <span className="text-white/40 text-[9px] uppercase mono">Fase {current.seg}/6</span>
                                    <h3 className="text-3xl font-black text-white mt-2 italic tracking-tight">{current.title}</h3>
                                </div>
                                <div className={`text-5xl font-black mono ${timer < 10 ? 'text-red-500 animate-pulse' : 'text-slate-800'}`}>{timer}</div>
                            </div>
                            
                            <p className="text-xl text-slate-300 leading-relaxed mb-12 font-light">{current.text}</p>

                            <div className="grid gap-4 mt-auto">
                                {current.options.map((opt, i) => (
                                    <button key={i} disabled={!!feedback} onClick={() => handleSelection(opt.s, opt.i, opt.f)}
                                        className="text-left p-6 rounded-3xl border border-white/10 bg-white/5 hover:bg-cyan-500/10 hover:border-cyan-500 transition-all group flex items-center disabled:opacity-50">
                                        <span className="w-12 h-12 rounded-2xl bg-black flex items-center justify-center mr-6 text-cyan-500 font-black group-hover:bg-cyan-500 group-hover:text-white transition-all">{String.fromCharCode(65+i)}</span>
                                        <span className="flex-1 text-base font-bold text-slate-200">{opt.t}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="lg:col-span-4 flex flex-col items-center justify-center gap-6">
                            <div className="w-full glass p-6 rounded-[35px] border-l-4 border-cyan-500">
                                <p className="text-[10px] text-slate-500 uppercase font-black mb-2 tracking-widest">Sessão Ativa</p>
                                <p className="text-sm font-bold text-white uppercase">{user.name}</p>
                                <div className="mt-4 h-1 bg-white/10 rounded-full">
                                    <div className="h-full bg-cyan-500 rounded-full transition-all" style={{width: `${(currentIdx/ALL_SCENARIOS.length)*100}%`}}></div>
                                </div>
                            </div>

                            <div className="flex flex-col items-center min-h-[300px] justify-end">
                                {feedback && (
                                    <div className="speech-bubble mb-6 animate-pop">
                                        {feedback}
                                    </div>
                                )}
                                <div className="relative">
                                    <img src={PROFESSORA_IMAGE} alt="Professora" className="prof-avatar shadow-[0_0_40px_rgba(6,182,212,0.3)]" 
                                         onError={(e) => { e.target.src = "https://cdn-icons-png.flaticon.com/512/1998/1998614.png"; }} />
                                    <div className="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-4 border-slate-900 rounded-full"></div>
                                </div>
                                <p className="mt-4 text-[10px] font-black text-cyan-500 uppercase tracking-[0.3em]">Prof. Siomara</p>
                                <p className="text-[9px] text-slate-500 italic">Orientadora da Simulação</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MetricBar({ label, val, color }) {
            return (
                <div className="glass p-5 rounded-[25px] border-b-2 border-white/5">
                    <div className="flex justify-between text-[9px] uppercase font-black tracking-widest mb-3 opacity-50">
                        <span>{label}</span>
                        <span className="mono">{val.toFixed(0)}%</span>
                    </div>
                    <div className="h-1 bg-white/5 rounded-full overflow-hidden">
                        <div className={`h-full ${color} bar-transition`} style={{ width: `${val}%` }}></div>
                    </div>
                </div>
            );
        }

        function StatCard({ label, val, color }) {
            return (
                <div className="p-4 bg-white/5 rounded-3xl border border-white/5">
                    <div className="text-[9px] text-slate-500 uppercase mb-1 font-bold tracking-tighter">{label}</div>
                    <div className={`text-2xl font-black ${color}`}>{val.toFixed(0)}%</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

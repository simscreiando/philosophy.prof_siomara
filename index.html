<script>

const { useState, useEffect, useRef, useCallback } = React;
const FETCH_HELP = "Não foi possível falar com a sua Planilha Google. Verifique, nesta ordem:\n" +
    "1) o endereço do Apps Script está colado em BACKEND_URL no index.html;\n" +
    "2) na implantação, 'Executar como' está como 'Eu' (a proprietária do script);\n" +
    "3) 'Quem pode acessar' está como 'Qualquer pessoa' — e NÃO 'Qualquer pessoa com uma Conta do Google';\n" +
    "4) o endereço termina em /exec (o /dev não funciona no site);\n" +

const FIX_DEPLOY = "Corrija assim: Implantar > Gerenciar implantações > editar (lápis) > " +
    "Executar como: Eu | Quem pode acessar: Qualquer pessoa (sem 'com uma Conta do Google') " +
    "> Implantar nova versão.";
async function api(action, data) {
    if (!BACKEND_URL)
        throw new Error("BACKEND_URL não configurada no index.html. " + FETCH_HELP);
    let res;
    try {
        res = await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(Object.assign({ action }, data || {})),
            redirect: "follow"
        });
    }
    catch (e) {
        throw new Error(FETCH_HELP);
    }
    let out;
    try {
        out = await res.json();
    }
    catch (e) {
        throw new Error("O endereço respondeu, mas não como esperado (código " + res.status + "). " + FETCH_HELP);
    }
    if (!out.ok)
        throw new Error(out.error || "Erro no servidor");
    return out;
}
async function testConnection() {
    if (!BACKEND_URL)
        return "BACKEND_URL está vazia no index.html — cole ali o endereço /exec do Apps Script.";
    if (!/\/exec$/.test(BACKEND_URL.trim()))
        return "O endereço em BACKEND_URL não termina em /exec. Use o link final da implantação.";
    try {
        const res = await fetch(BACKEND_URL, { method: "GET", redirect: "follow" });
        const txt = await res.text();
        const low = (txt || "").toLowerCase();
        const finalUrl = (res.url || "").toLowerCase();
        if (txt.indexOf('"service"') >= 0)
            return "Conexão OK! O servidor da planilha respondeu normalmente.";
        if (finalUrl.indexOf("accounts.google.com") >= 0)
            return "O endereço está pedindo login do Google (foi redirecionado para accounts.google.com). " +
                "Isso acontece quando a implantação está como 'Executar como: Usuário com acesso ao app da Web' " +
                "e/ou 'Quem pode acessar: Qualquer pessoa com uma Conta do Google'. " + FIX_DEPLOY;
        if (low.indexOf("sign in") >= 0 || low.indexOf("fazer login") >= 0 || low.indexOf("faça login") >= 0 ||
            low.indexOf("choose an account") >= 0 || low.indexOf("escolha uma conta") >= 0)
            return "O servidor devolveu uma tela de login em vez do JSON da atividade. " +
                "A implantação está executando como 'Usuário com acesso' ou exigindo Conta do Google. " + FIX_DEPLOY;
        if (res.status === 401 || res.status === 403)
            return "Acesso negado (código " + res.status + "). A implantação não está pública. " + FIX_DEPLOY;
        return "O endereço respondeu (código " + res.status + "), mas não é o servidor das atividades. Confira se colou a URL certa.";
    }
    catch (e) {
        return "A chamada foi bloqueada pelo navegador (típico de implantação que redireciona para o login do Google). " +
            FIX_DEPLOY + "\n\n" + FETCH_HELP;
    }
}
function beacon(action, data) {
    if (!BACKEND_URL)
        return;
    try {
        fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(Object.assign({ action }, data || {})),
            keepalive: true
        }).catch(() => { });
    }
    catch (e) { }
}
function sendEmail(payload) {
    if (!WEB3FORMS_KEY)
        return;
    try {
        fetch("https://api.web3forms.com/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(Object.assign({ access_key: WEB3FORMS_KEY }, payload)),
            keepalive: true
        }).catch(() => { });
    }
    catch (e) { }
}
const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

    get(k) { try {
        return JSON.parse(sessionStorage.getItem(k));
    }
    catch (e) {
        return null;
    } },
    set(k, v) { try {
        sessionStorage.setItem(k, JSON.stringify(v));
    }
    catch (e) { } },
    del(k) { try {
        sessionStorage.removeItem(k);
    }
    catch (e) { } }
};

function ThemeToggle() {
    const [t, setT] = useState(document.documentElement.getAttribute("data-theme") || "dark");

        const n = t === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", n);
        try {
            localStorage.setItem("theme", n);
        }
        catch (e) { }
        setT(n);

        sessionStorage.removeItem("reloaded");
    }

        React.createElement(ThemeToggle, null));
}

    return (React.createElement("div", { className: "min-h-screen flex items-center justify-center p-6" },
        React.createElement("div", { className: "glass p-10 rounded-3xl max-w-xl border-t-4 border-yellow-500" },
            React.createElement("h1", { className: "text-2xl font-black mb-4" }, "Configura\u00E7\u00E3o pendente"),
            React.createElement("p", { className: "text-slate-300 text-sm leading-relaxed" },
                "Abra o arquivo ",
                React.createElement("span", { className: "mono text-cyan-400" }, "index.html"),
                " e preencha",
                React.createElement("span", { className: "mono text-cyan-400" }, " BACKEND_URL"),
                " e",
                React.createElement("span", { className: "mono text-cyan-400" }, " GOOGLE_CLIENT_ID"),
                ". O passo a passo est\u00E1 no arquivo ",
                React.createElement("span", { className: "mono text-cyan-400" }, "LEIA-ME.md"),
                "."))));
}

    return (React.createElement("div", { className: "min-h-screen flex items-center justify-center p-6" },

}
function Student() {
    const [screen, setScreen] = useState("login"); // login|choose|summary|rules|playing|blocked|end|sending
    const [auth, setAuth] = useState(store.get("auth"));
    const [error, setError] = useState("");
    const [activities, setActivities] = useState([]);
    const [activity, setActivity] = useState(null);
    const [turma, setTurma] = useState("");
    const [code, setCode] = useState("");
    const [order, setOrder] = useState([]); // perguntas embaralhadas
    const [idx, setIdx] = useState(0);
    const [score, setScore] = useState(0);
    const [bars, setBars] = useState({});
    const [answers, setAnswers] = useState([]);
    const [feedback, setFeedback] = useState(null);
    const [timer, setTimer] = useState(60);
    const [chapterPopup, setChapterPopup] = useState(null);
    const [blockedMsg, setBlockedMsg] = useState("");
    const [grade, setGrade] = useState(null);
    const [introTimer, setIntroTimer] = useState(0);
    const [granted, setGranted] = useState(store.get("granted") || []); // atividades liberadas por código
    const [notice, setNotice] = useState("");
    const [loadingActs, setLoadingActs] = useState(false);
    const addGranted = (act, grantCode) => {
        setGranted((prev) => {
            const next = prev.filter((g) => g.id !== act.id).concat([Object.assign({}, act, { grantCode: grantCode || "" })]);
            store.set("granted", next);
            return next;
        });
    };
    const redeemCode = async () => {
        setError("");
        setNotice("");
        const c = code.trim();
        if (!c) {
            setError("Digite o código da atividade.");
            return;
        }
        try {
            const r = await api("activityByCode", { token: auth.token, code: c });
            addGranted(r.activity, c.toUpperCase());
            setNotice("Atividade liberada: " + r.activity.title);
        }
        catch (e) {
            setError(e.message);
        }
    };
    const ref = useRef({});
    useEffect(() => { ref.current = { screen, auth, activity, idx, score, bars, answers, turma }; });
    useEffect(() => { if (auth)
        store.set("auth", auth); }, [auth]);
    /* ---- lista de atividades ---- */
    useEffect(() => {
        if (!auth)
            return;
        setLoadingActs(true);
        api("activities").then((r) => setActivities(r.activities)).catch((e) => setError(e.message)).then(() => setLoadingActs(false));
        if (screen === "login")
            setScreen("choose");

    /* ---- botão Google ---- */
    useEffect(() => {
        if (auth || screen !== "login" || !GOOGLE_CLIENT_ID)
            return;
        let tries = 0;

            if (window.google && window.google.accounts && document.getElementById("gbtn")) {
                clearInterval(t);
                window.google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    hd: ALLOWED_DOMAIN || undefined,
                    callback: async (resp) => {
                        try {
                            const r = await api("loginGoogle", { credential: resp.credential });

                        estudante: s.auth.nome + " (BLOQUEADO)", turma: s.turma,

            window.removeEventListener("visibilitychange", onVis);
            document.removeEventListener("visibilitychange", onVis);
            window.removeEventListener("blur", onExit);
            window.removeEventListener("pagehide", onExit);

        if (screen !== "summary" && screen !== "rules")
            return;

        const t = setInterval(() => setIntroTimer((v) => v + 1), 1000);

        if (screen !== "playing" || feedback || chapterPopup)
            return;

            return;

    const enter = async (act) => {

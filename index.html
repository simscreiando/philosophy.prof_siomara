    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FORMSPREE_ID = "xzdoopyw"; 
        const PROFESSORA_IMAGE = "https://raw.githubusercontent.com/simscreiando/philosophy.prof_siomara/72cd32ed88c92ff78ec2785c4779aacd652d6230/professora.png";

        const CHAPTER_INTRO = {
            1: { title: "O Direito como Objeto Cultural", context: "Você assume o seu gabinete em um momento de transição social. Lembre-se: o Direito não é um fenômeno da natureza, mas uma obra humana. Ele é cultura, valor e história." },
            2: { title: "Moral e Ética no Judiciário", context: "A lei nem sempre caminha ao lado da consciência individual. Agora, você enfrentará dilemas onde a frieza do código encontra o calor dos valores éticos." },
            3: { title: "A Busca pela Justiça Real", context: "O Tribunal exige segurança jurídica, mas o povo clama por Justiça. Seu desafio é equilibrar a estabilidade das instituições com a equidade." },
            4: { title: "Poder, Liberdade e Resistência", context: "O Estado é um gigante que pode proteger ou esmagar. Como consultor, você é o limite que garante a liberdade jurídica." },
            5: { title: "A Eficácia da Sanção", context: "A norma que não se impõe é letra morta. Entramos no campo da coação legítima e organizada necessária para a existência do Direito." }
        };

        const RAW_SCENARIOS = [
            // CAPÍTULO 1
            { ch: 1, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Após conflitos sociais sucessivos, grupos políticos passaram a defender que o Direito apenas limita impulsos naturais humanos e que a sociedade deveria organizar-se pela lógica espontânea da força. O Tribunal solicita parecer filosófico.", options: [
                { t: "O Direito existe para transformar impulsos naturais em convivência social orientada por valores éticos.", s: 1, i: {leg: 100, seg: 80, lib: 70}, f: "Correto! O Direito é um objeto cultural que submete a força à ética e à razão." },
                { t: "A prevalência natural dos mais fortes constitui fundamento legítimo da ordem jurídica.", s: 0, i: {leg: 30, seg: 50, lib: 20}, f: "Incorreto. Isso negaria a natureza cultural e ética do Direito segundo Nader." },
                { t: "O Direito deve apenas registrar práticas sociais já existentes, sem transformá-las.", s: 0, i: {leg: 40, seg: 90, lib: 10}, f: "Visão limitada. O Direito também possui função promocional e transformadora." },
                { t: "Toda forma de regulamentação jurídica compromete necessariamente a liberdade humana.", s: 0, i: {leg: 50, seg: 30, lib: 60}, f: "Falso. O Direito organiza a liberdade para que todos possam exercê-la." }
            ]},
            { ch: 1, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "O governo instituiu normas estrangeiras sem considerar costumes locais. Houve resistência social e descumprimento coletivo. O que isso demonstra sobre a natureza do Direito?", options: [
                { t: "A legitimidade do Direito depende de diálogo com valores culturais compartilhados.", s: 1, i: {leg: 100, seg: 70, lib: 80}, f: "Perfeito! Como objeto cultural, o Direito é 'vida humana objetivada'." },
                { t: "A eficácia jurídica decorre exclusivamente da capacidade estatal de aplicar sanções.", s: 0, i: {leg: 20, seg: 10, lib: 30}, f: "Errado. O Direito exige um mínimo de adesão social e ressonância cultural." },
                { t: "O Direito pode promover mudanças sociais, mas não pode ignorar os valores coletivos.", s: 0, i: {leg: 40, seg: 90, lib: 10}, f: "Correto, mas a alternativa anterior define melhor a essência cultural." },
                { t: "A cultura popular deve ser ignorada em prol de reformas institucionais modernas.", s: 0, i: {leg: 10, seg: 40, lib: 10}, f: "Isso gera 'leis que não pegam' e crise de legitimidade." }
            ]},
            { ch: 1, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Se uma lei jurídica é violada, ela perde sua validade? Como Nader diferencia isso das leis da natureza?", options: [
                { t: "Não. A violação aciona a sanção, pois o Direito opera no campo da liberdade e do valor.", s: 1, i: {leg: 90, seg: 100, lib: 70}, f: "Brilhante! O descumprimento da norma jurídica não afeta sua validade (Dever-Ser)." },
                { t: "Sim, pois no 'Dever-Ser' a validade depende do cumprimento absoluto.", s: 0, i: {leg: 50, seg: 10, lib: 80}, f: "Incorreto. Se fosse assim, o Direito deixaria de existir no primeiro crime." },
                { t: "A lei jurídica, se violada, torna-se uma lei física de causa e efeito imediato.", s: 0, i: {leg: 30, seg: 90, lib: 20}, f: "Falso. A sanção é uma consequência imputada, não um efeito mecânico." },
                { t: "A validade da norma é irrelevante perante a eficácia social do comportamento.", s: 0, i: {leg: 20, seg: 10, lib: 100}, f: "Errado. Validade, vigência e eficácia são conceitos distintos." }
            ]},
            { ch: 1, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Um orador afirma que o Direito funciona como a lei da gravidade: automática e inevitável. Qual o erro técnico nessa afirmação?", options: [
                { t: "As normas jurídicas pertencem ao campo do dever-ser e pressupõem liberdade e valoração.", s: 1, i: {leg: 100, seg: 60, lib: 90}, f: "Exato! O Direito lida com condutas humanas, que são essencialmente contingentes." },
                { t: "Leis naturais e jurídicas possuem a mesma estrutura mecânica de causa e efeito.", s: 0, i: {leg: 10, seg: 100, lib: 10}, f: "Falso. Leis naturais regem o 'Ser'; leis jurídicas regem o 'Dever-Ser'." },
                { t: "O Direito não se reduz a relações automáticas, mas é previsível como a física.", s: 0, i: {leg: 40, seg: 80, lib: 40}, f: "A previsibilidade jurídica é axiológica, não mecânica." },
                { t: "A função do Direito consiste apenas em prever comportamentos humanos recorrentes.", s: 0, i: {leg: 10, seg: 90, lib: 0}, f: "Esta é uma visão sociológica extrema que ignora o caráter normativo." }
            ]},
            { ch: 1, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "O Parlamento debate se o Direito deve refletir vontades momentâneas ou fundamentos permanentes. Qual a visão de Nader?", options: [
                { t: "A ordem jurídica articula realidade social e princípios universais do Direito Natural.", s: 1, i: {leg: 30, seg: 50, lib: 40}, f: "Correto. O Direito Natural serve como fundamento para o Direito Positivo." },
                { t: "O Direito Natural é um sistema imutável que impede adaptações históricas.", s: 0, i: {leg: 60, seg: 100, lib: 10}, f: "Incorreto. Nader vê o Direito Natural como uma baliza, não uma jaula." },
                { t: "O Direito Positivo deve ser uma cópia exata de preceitos religiosos universais.", s: 0, i: {leg: 100, seg: 70, lib: 80}, f: "Falso. O Direito é laico e voltado à organização da cidade." },
                { t: "Princípios como liberdade e vida dependem exclusivamente da vontade política da época.", s: 0, i: {leg: 40, seg: 10, lib: 100}, f: "Errado. Isso seria positivismo radical, ignorando valores perenes." }
            ]},
            { ch: 1, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Um cidadão é processado por conduta moralmente reprovável, mas sem lei anterior que a proíba. Como o Direito resolve essa tensão?", options: [
                { t: "O Direito exige predeterminação formal e tipificação para garantir segurança jurídica.", s: 1, i: {leg: 50, seg: 100, lib: 10}, f: "Excelente! 'Não há crime sem lei anterior que o defina'." },
                { t: "A reprovação social é suficiente para punir, mesmo sem lei escrita.", s: 0, i: {leg: 100, seg: 80, lib: 90}, f: "Incorreto. Isso geraria arbítrio e insegurança." },
                { t: "O juiz deve criar a norma no momento do julgamento baseado em sua moral.", s: 0, i: {leg: 40, seg: 90, lib: 20}, f: "Falso. No sistema de Civil Law, o juiz é submetido à lei." },
                { t: "A moralidade social deve substituir a norma escrita em casos de grande clamor.", s: 0, i: {leg: 10, seg: 100, lib: 10}, f: "Errado. O Direito e a Moral são campos distintos." }
            ]},

            // CAPÍTULO 2
            { ch: 2, title: "DIREITO, MORAL E ÉTICA", text: "Muitos cidadãos cumprem normas por receio de punição, embora discordem delas intimamente. Como a teoria explica isso?", options: [
                { t: "O Direito exige comportamentos externos independente da adesão moral interna.", s: 1, i: {leg: 100, seg: 90, lib: 60}, f: "Correto! É a heteronomia e a exterioridade do Direito frente à autonomia da Moral." },
                { t: "Normas jurídicas somente valem se houver coincidência com a consciência individual.", s: 0, i: {leg: 30, seg: 20, lib: 100}, f: "Falso. O Direito se impõe mesmo contra a vontade do destinatário." },
                { t: "Direito e Moral são campos idênticos e exigem a mesma disposição interna.", s: 0, i: {leg: 10, seg: 10, lib: 10}, f: "Incorreto. A Moral exige adesão íntima; o Direito satisfaz-se com a legalidade externa." },
                { t: "A validade da norma depende da aceitação ética de cada cidadão.", s: 0, i: {leg: 80, seg: 70, lib: 50}, f: "A aceitação ajuda na eficácia, mas não é condição de validade jurídica." }
            ]},
            { ch: 2, title: "DIREITO, MORAL E ÉTICA", text: "Qual a diferença técnica entre 'Coerção' e 'Coercibilidade' na fundamentação do Direito?", options: [
                { t: "A coercibilidade é a possibilidade lógica e legítima de uso da força, se necessário.", s: 1, i: {leg: 90, seg: 100, lib: 70}, f: "Exato! O Direito é coercível (potencial), mesmo quando não há coação (ato)." },
                { t: "A coercibilidade é o uso efetivo da força física no momento da infração.", s: 0, i: {leg: 40, seg: 100, lib: 10}, f: "Errado. Isso é a coação em exercício." },
                { t: "A sanção moral é mais forte que a jurídica, pois atinge o espírito do indivíduo.", s: 0, i: {leg: 20, seg: 50, lib: 30}, f: "Subjetivo. Juridicamente, a sanção estatal é a única com força institucional." },
                { t: "A força estatal é um elemento secundário e desnecessário à definição de Direito.", s: 0, i: {leg: 70, seg: 60, lib: 80}, f: "A força é um instrumento essencial para garantir a ordem jurídica." }
            ]},
            { ch: 2, title: "DIREITO, MORAL E ÉTICA", text: "Sobre a distinção entre Ética e Moral em Bittar e Mascaro, qual a afirmação correta?", options: [
                { t: "A Moral é a prática cotidiana; a Ética é a reflexão filosófica crítica sobre essa prática.", s: 1, i: {leg: 100, seg: 60, lib: 90}, f: "Perfeito! Ética é a ciência do comportamento moral." },
                { t: "Ética e Moral são sinônimos perfeitos em qualquer contexto acadêmico.", s: 0, i: {leg: 30, seg: 30, lib: 30}, f: "Falso. Academicamente, distingue-se o objeto (moral) da reflexão (ética)." },
                { t: "O Direito substitui a Ética em sociedades modernas e desenvolvidas.", s: 0, i: {leg: 10, seg: 10, lib: 10}, f: "Incorreto. O Direito deve ser pautado pela ética." },
                { t: "A Moral é individual, enquanto a Ética é sempre uma imposição do Estado.", s: 0, i: {leg: 80, seg: 80, lib: 70}, f: "Errado. O Estado impõe o Direito; a Ética é racional." }
            ]},
            { ch: 2, title: "DIREITO, MORAL E ÉTICA", text: "Um jurista afirma: 'Sou um técnico, aplico a lei e não me preocupo com a justiça'. Como Bittar avalia isso?", options: [
                { t: "O jurista deve ter compromisso ético e consciência dos impactos sociais.", s: 1, i: {leg: 100, seg: 50, lib: 100}, f: "Correto! Bittar defende uma prática jurídica comprometida com a emancipação." },
                { t: "A técnica pura é a única salvaguarda contra o arbítrio dos juízes.", s: 0, i: {leg: 20, seg: 100, lib: 10}, f: "Visão positivista clássica que ignora a responsabilidade ética." },
                { t: "A responsabilidade do jurista limita-se ao cumprimento dos prazos processuais.", s: 0, i: {leg: 50, seg: 70, lib: 40}, f: "Errado. O Direito é um instrumento social." },
                { t: "Decisões jurídicas são neutras e não possuem carga valorativa.", s: 0, i: {leg: 80, seg: 60, lib: 80}, f: "Falso. Toda escolha jurídica envolve uma preferência axiológica." }
            ]},
            { ch: 2, title: "DIREITO, MORAL E ÉTICA", text: "Considerando a teoria do 'Círculo de Reale', qual a relação entre Direito e Moral?", options: [
                { t: "Direito e Moral são círculos secantes: possuem uma área comum e autonomia própria.", s: 1, i: {leg: 100, seg: 70, lib: 80}, f: "Exato! O Direito possui uma zona de indiferença moral e vice-versa." },
                { t: "Todo o Direito está contido na Moral, não havendo nada jurídico que não seja moral.", s: 0, i: {leg: 60, seg: 80, lib: 40}, f: "Isso seria o 'Mínimo Ético' radical, que Reale critica." },
                { t: "Direito e Moral são círculos concêntricos e indissociáveis.", s: 0, i: {leg: 10, seg: 50, lib: 10}, f: "Falso. Há normas jurídicas tecnicamente neutras." },
                { t: "O Direito deve se afastar totalmente da Moral para ser considerado ciência.", s: 0, i: {leg: 70, seg: 90, lib: 30}, f: "Esta é a tese de Kelsen, não a de Reale." }
            ]},
            { ch: 2, title: "DIREITO, MORAL E ÉTICA", text: "Para Bittar e Mascaro, o Direito pode ser usado para manter privilégios ou transformar a sociedade. Qual define essa última?", options: [
                { t: "O Direito como instrumento de emancipação e justiça social.", s: 1, i: {leg: 100, seg: 50, lib: 100}, f: "Correto! É a função promocional e crítica do Direito." },
                { t: "O Direito como mera manutenção do status quo e da ordem vigente.", s: 0, i: {leg: 40, seg: 100, lib: 10}, f: "Esta é a função conservadora, criticada pelos autores." },
                { t: "A neutralidade absoluta diante das desigualdades estruturais.", s: 0, i: {leg: 20, seg: 20, lib: 50}, f: "A neutralidade em contextos injustos perpetua a injustiça." },
                { t: "A aplicação literal da lei, ignorando o contexto histórico.", s: 0, i: {leg: 90, seg: 60, lib: 90}, f: "Isso é formalismo jurídico, contrário à visão crítica." }
            ]},

            // CAPÍTULO 3
            { ch: 3, title: "JUSTIÇA MATERIAL", text: "Uma lei é formalmente perfeita, mas gera miséria extrema em uma região. Como a Filosofia avalia?", options: [
                { t: "A legalidade só é legítima se compatível com critérios materiais de justiça.", s: 1, i: {leg: 100, seg: 60, lib: 90}, f: "Exato! É o combate ao legalismo cego." },
                { t: "A validade formal deve prevalecer sempre para evitar a anarquia.", s: 0, i: {leg: 50, seg: 100, lib: 10}, f: "Falso. O Direito deve buscar a justiça, não apenas a forma." },
                { t: "A justiça é um conceito puramente subjetivo e não deve interferir.", s: 0, i: {leg: 70, seg: 90, lib: 30}, f: "Incorreto. A justiça é o valor-meta do Direito." },
                { t: "O Estado deve ignorar a lei e agir conforme a vontade do governante.", s: 0, i: {leg: 80, seg: 70, lib: 80}, f: "Errado. Isso seria autoritarismo." }
            ]},
            { ch: 3, title: "JUSTIÇA DISTRIBUTIVA", text: "Na visão aristotélica, como o Estado deve distribuir bens escassos?", options: [
                { t: "Tratar desigualmente os desiguais na medida de suas desigualdades.", s: 1, i: {leg: 90, seg: 70, lib: 100}, f: "Perfeito! É a justiça proporcional ou geométrica." },
                { t: "Dar exatamente a mesma quantidade para todos, ignorando as necessidades.", s: 0, i: {leg: 60, seg: 50, lib: 60}, f: "Isso é igualdade aritmética, não justiça distributiva." },
                { t: "Favorecer os mais fortes, pois eles contribuem mais para a economia.", s: 0, i: {leg: 20, seg: 100, lib: 10}, f: "Falso. Isso violaria o sentido ético da distribuição." },
                { t: "A distribuição deve ser aleatória para garantir imparcialidade total.", s: 0, i: {leg: 80, seg: 60, lib: 90}, f: "Errado. A justiça exige critérios racionais." }
            ]},
            { ch: 3, title: "SEGURANÇA JURÍDICA", text: "O Tribunal muda de opinião radicalmente sobre um imposto toda semana. Qual princípio está sendo violado?", options: [
                { t: "Princípio da Segurança Jurídica (Previsibilidade e Confiança).", s: 1, i: {leg: 100, seg: 100, lib: 70}, f: "Exato! Sem estabilidade, o cidadão não pode planejar sua vida." },
                { t: "Princípio da Supremacia do Interesse Público.", s: 0, i: {leg: 30, seg: 20, lib: 100}, f: "Incorreto. A mudança constante prejudica o interesse público." },
                { t: "Princípio da Verdade Real.", s: 0, i: {leg: 70, seg: 90, lib: 40}, f: "Não se aplica aqui. Este princípio é comum no processo penal." },
                { t: "Princípio da Economia Processual.", s: 0, i: {leg: 10, seg: 100, lib: 0}, f: "Irrelevante para este problema." }
            ]},
            { ch: 3, title: "DIGNIDADE HUMANA", text: "Um projeto de lei sugere que presos percam o direito a banho para economizar água. Como o Direito reage?", options: [
                { t: "A dignidade da pessoa humana é o limite intransponível de qualquer corte.", s: 1, i: {leg: 100, seg: 50, lib: 100}, f: "Correto! É o núcleo essencial dos direitos fundamentais." },
                { t: "O projeto é válido, pois presos perderam seus direitos ao cometer crimes.", s: 0, i: {leg: 40, seg: 90, lib: 20}, f: "Falso. A dignidade humana é irrenunciável." },
                { t: "O sofrimento físico faz parte da punição necessária para a reforma.", s: 0, i: {leg: 10, seg: 80, lib: 0}, f: "Absurdo jurídico. A pena é privação de liberdade, não imolação." },
                { t: "A dignidade humana só se aplica a cidadãos que pagam impostos.", s: 0, i: {leg: 70, seg: 40, lib: 80}, f: "Errado. A dignidade decorre da condição humana." }
            ]},
            { ch: 3, title: "EQUIDADE", text: "O que significa 'Equidade' na aplicação da Justiça segundo a tradição clássica?", options: [
                { t: "A correção da lei no caso concreto, adaptando a norma geral às particularidades.", s: 1, i: {leg: 100, seg: 60, lib: 100}, f: "Exato! A equidade é a 'justiça do caso concreto'." },
                { t: "A aplicação rígida e literal da lei, custe o que custar.", s: 0, i: {leg: 60, seg: 100, lib: 10}, f: "Isso é 'Summum jus, summa injuria'." },
                { t: "A substituição das leis escritas pela intuição pessoal do magistrado.", s: 0, i: {leg: 80, seg: 80, lib: 80}, f: "Falso. A equidade ampara-se na lei buscando sua finalidade justa." },
                { t: "Um privilégio concedido apenas a autoridades influentes.", s: 0, i: {leg: 20, seg: 40, lib: 50}, f: "Errado. Isso seria favoritismo." }
            ]},
            { ch: 3, title: "JUSTIÇA SOCIAL", text: "Qual o objetivo primordial das 'Ações Afirmativas' no Direito moderno?", options: [
                { t: "Garantir a igualdade material, corrigindo desníveis históricos.", s: 1, i: {leg: 100, seg: 70, lib: 100}, f: "Correto! Busca-se a igualdade real, não apenas a formal." },
                { t: "Punir os filhos pelos erros cometidos por seus antepassados.", s: 0, i: {leg: 50, seg: 90, lib: 60}, f: "Falso. O foco é a reestruturação das oportunidades atuais." },
                { t: "Violar o princípio do mérito para favorecer grupos políticos.", s: 0, i: {leg: 40, seg: 90, lib: 20}, f: "Incorreto. O mérito exige ponto de partida igual." },
                { t: "Promover o caos jurídico para desestabilizar as instituições.", s: 0, i: {leg: 90, seg: 80, lib: 80}, f: "Errado. Visam a paz social via inclusão." }
            ]},

            // CAPÍTULO 4
            { ch: 4, title: "LIBERDADE JURÍDICA", text: "Segundo Kant, qual a definição de Direito relacionada à liberdade?", options: [
                { t: "O Direito é o conjunto de condições que permite a convivência dos arbítrios livres.", s: 1, i: {leg: 100, seg: 70, lib: 90}, f: "Perfeito! Minha liberdade termina onde começa a do outro." },
                { t: "O Direito é a supressão total da liberdade em favor da paz absoluta.", s: 0, i: {leg: 10, seg: 100, lib: 0}, f: "Esta é a visão de Hobbes, não de Kant." },
                { t: "A liberdade jurídica permite fazer tudo o que se deseja, sem restrições.", s: 0, i: {leg: 30, seg: 10, lib: 100}, f: "Falso. Isso seria o estado de natureza." },
                { t: "Direito e Liberdade são conceitos antagônicos e irreconciliáveis.", s: 0, i: {leg: 80, seg: 90, lib: 60}, f: "Incorreto. O Direito é a garantia da liberdade organizada." }
            ]},
            { ch: 4, title: "LEGITIMIDADE E PODER", text: "Qual a diferença fundamental entre um bando de piratas e um Estado?", options: [
                { t: "O Estado baseia seu poder no Direito e na busca pelo Bem Comum (Legitimidade).", s: 1, i: {leg: 100, seg: 60, lib: 80}, f: "Exato! A força do Estado é institucionalizada e justificada." },
                { t: "Nenhuma, ambos usam a força para impor sua vontade aos outros.", s: 0, i: {leg: 30, seg: 100, lib: 10}, f: "Esta é a visão do realismo amoral." },
                { t: "O Estado tem mais armas e mais dinheiro que os piratas.", s: 0, i: {leg: 50, seg: 90, lib: 30}, f: "Diferença quantitativa, não qualitativa." },
                { t: "Os piratas agem no mar, enquanto o Estado age apenas em terra.", s: 0, i: {leg: 90, seg: 80, lib: 70}, f: "Irrelevante." }
            ]},
            { ch: 4, title: "ESTADO DE DIREITO", text: "O que caracteriza o 'Império da Lei' em um Estado Democrático de Direito?", options: [
                { t: "Todos, inclusive os governantes, estão submetidos à lei.", s: 1, i: {leg: 100, seg: 50, lib: 90}, f: "Correto! É o limite jurídico ao poder." },
                { t: "O governante cria as leis, mas não precisa segui-las por ser autoridade.", s: 0, i: {leg: 10, seg: 100, lib: 10}, f: "Falso. Isso seria absolutismo." },
                { t: "A lei só se aplica aos cidadãos comuns sem cargos públicos.", s: 0, i: {leg: 90, seg: 80, lib: 70}, f: "Incorreto. A igualdade é pilar do Estado de Direito." },
                { t: "As leis mudam conforme a vontade do povo em pesquisas diárias.", s: 0, i: {leg: 40, seg: 60, lib: 40}, f: "Errado. Exige processos formais." }
            ]},
            { ch: 4, title: "PODER E RESISTÊNCIA", text: "Quando uma lei é manifestamente injusta e fere a dignidade, o que a filosofia propõe?", options: [
                { t: "O direito à resistência ou desobediência civil contra a opressão.", s: 1, i: {leg: 100, seg: 20, lib: 100}, f: "Correto! Leis injustas não teriam força de lei na consciência." },
                { t: "Obediência cega, pois a lei é a lei (Dura lex, sed lex).", s: 0, i: {leg: 40, seg: 70, lib: 50}, f: "Visão do positivismo exegético radical." },
                { t: "A fuga imediata do país para evitar conflito.", s: 0, i: {leg: 10, seg: 100, lib: 0}, f: "Escolha pessoal, não solução jurídica." },
                { t: "A aceitação passiva esperando as próximas gerações.", s: 0, i: {leg: 60, seg: 80, lib: 40}, f: "Falso. O Direito envolve a luta pela justiça." }
            ]},
            { ch: 4, title: "DIGNIDADE COMO FIM", text: "Kant afirma que o homem é um 'fim em si mesmo'. O que isso proíbe o Estado de fazer?", options: [
                { t: "Usar um indivíduo como mero instrumento para fins políticos ou de segurança.", s: 1, i: {leg: 100, seg: 30, lib: 100}, f: "Exato! Proíbe a instrumentalização (ex: tortura)." },
                { t: "Cobrar impostos para financiar a saúde pública.", s: 0, i: {leg: 10, seg: 80, lib: 10}, f: "Incorreto. Impostos são legítimos." },
                { t: "Exigir que os cidadãos votem em eleições periódicas.", s: 0, i: {leg: 90, seg: 50, lib: 90}, f: "Falso. Participação é exercício de cidadania." },
                { t: "Proibir o consumo de substâncias em locais públicos.", s: 0, i: {leg: 30, seg: 60, lib: 40}, f: "Não fere necessariamente a dignidade se baseada em lei." }
            ]},
            { ch: 4, title: "CONTROLE E VIGILÂNCIA", text: "Como Foucault descreve a mudança do poder nas sociedades modernas?", options: [
                { t: "O poder opera de forma disciplinar, vigiando e normalizando condutas.", s: 1, i: {leg: 80, seg: 100, lib: 40}, f: "Exato! É a 'microfísica do poder'." },
                { t: "O poder tornou-se mais violento e focado em execuções públicas.", s: 0, i: {leg: 40, seg: 60, lib: 50}, f: "Falso. Mostra a transição para o controle disciplinar." },
                { t: "O Direito eliminou todas as formas de poder.", s: 0, i: {leg: 60, seg: 40, lib: 70}, f: "Incorreto. O Direito é uma forma de poder." },
                { t: "A tecnologia acabou com a necessidade de leis.", s: 0, i: {leg: 10, seg: 100, lib: 0}, f: "Falso. Cria novos mecanismos." }
            ]},

            // CAPÍTULO 5
            { ch: 5, title: "COAÇÃO VS COERCIBILIDADE", text: "Um devedor paga sua dívida porque sabe que o juiz pode penhorar sua casa. O que operou aqui?", options: [
                { t: "A coercibilidade, que é a pressão psicológica e potencial do uso da força.", s: 1, i: {leg: 100, seg: 80, lib: 70}, f: "Perfeito! É a coercibilidade agindo preventivamente." },
                { t: "A coação direta e física, pois o oficial já arrombou a porta.", s: 0, i: {leg: 40, seg: 20, lib: 100}, f: "Incorreto. A penhora ainda não ocorreu." },
                { t: "A sanção moral, pois o devedor ficou com remorso.", s: 0, i: {leg: 10, seg: 10, lib: 40}, f: "Errado. O pagamento foi por receio patrimonial." },
                { t: "O Direito Natural, que obriga todos a serem honestos.", s: 0, i: {leg: 10, seg: 50, lib: 10}, f: "É valor moral, mas aqui opera mecanismo positivo." }
            ]},
            { ch: 5, title: "SANÇÃO PREMIAL", text: "O Estado concede redução de impostos para empresas que não poluem. Como Reale classifica isso?", options: [
                { t: "Uma sanção premial, que oferece vantagem para estimular a lei.", s: 1, i: {leg: 90, seg: 100, lib: 70}, f: "Exato! O Direito também vive de estímulos." },
                { t: "Uma sanção negativa, pois pune quem polui.", s: 0, i: {leg: 40, seg: 100, lib: 10}, f: "Falso. Foca no benefício pelo cumprimento." },
                { t: "Um ato de corrupção estatal.", s: 0, i: {leg: 20, seg: 50, lib: 30}, f: "Errado. Incentivos sociais são legítimos." },
                { t: "Uma norma puramente moral, sem caráter jurídico.", s: 0, i: {leg: 70, seg: 60, lib: 80}, f: "Incorreto. Gera efeitos tributários legais." }
            ]},
            { ch: 5, title: "BILATERALIDADE ATRIBUTIVA", text: "O que diferencia a norma jurídica da moral em Reale?", options: [
                { t: "A bilateralidade atributiva: o Direito confere poder de exigir o cumprimento.", s: 1, i: {leg: 100, seg: 60, lib: 90}, f: "Excelente! Uma parte tem o dever e a outra a pretensão de exigir." },
                { t: "A norma moral é escrita, enquanto o Direito é falado.", s: 0, i: {leg: 30, seg: 30, lib: 30}, f: "Absurdo. É o oposto." },
                { t: "O Direito foca apenas no passado.", s: 0, i: {leg: 10, seg: 10, lib: 10}, f: "Sem fundamento." },
                { t: "Não há diferença.", s: 0, i: {leg: 80, seg: 80, lib: 70}, f: "Falso. Reale defende autonomia relativa." }
            ]},
            { ch: 5, title: "SANÇÃO E EFICÁCIA", text: "Uma lei proíbe andar de camiseta verde, mas ninguém obedece e a polícia não multa. O que acontece?", options: [
                { t: "A norma é válida, mas é socialmente ineficaz ('não pegou').", s: 1, i: {leg: 100, seg: 50, lib: 100}, f: "Correto! É o descompasso entre validade e eficácia." },
                { t: "A norma perde sua validade imediatamente.", s: 0, i: {leg: 20, seg: 100, lib: 10}, f: "Falso. Continua válida até ser revogada." },
                { t: "A falta de sanção prova que o Direito não precisa de força.", s: 0, i: {leg: 50, seg: 70, lib: 40}, f: "Errado. Prova falha no sistema." },
                { t: "A norma torna-se lei natural.", s: 0, i: {leg: 80, seg: 60, lib: 80}, f: "Absurdo." }
            ]},
            { ch: 5, title: "ORGANIZAÇÃO DA SANÇÃO", text: "Quem detém o monopólio legítimo da sanção jurídica na modernidade?", options: [
                { t: "O Estado, através de órgãos competentes e processos regulados.", s: 1, i: {leg: 100, seg: 70, lib: 80}, f: "Exato! O Estado centraliza a força para evitar a barbárie." },
                { t: "Cada cidadão (justiça com as próprias mãos).", s: 0, i: {leg: 60, seg: 80, lib: 40}, f: "Falso. É autotutela proibida." },
                { t: "As empresas privadas e milícias.", s: 0, i: {leg: 10, seg: 50, lib: 10}, f: "Incorreto. É ilícito." },
                { t: "A Igreja.", s: 0, i: {leg: 70, seg: 90, lib: 30}, f: "Errado. O Estado moderno é laico." }
            ]},
            { ch: 5, title: "FINALIDADE DA SANÇÃO", text: "Qual a função precípua da sanção no Direito Civil (ex: indenização)?", options: [
                { t: "Restaurar o equilíbrio quebrado, reparando o dano causado.", s: 1, i: {leg: 100, seg: 50, lib: 100}, f: "Perfeito! É a função reparatória." },
                { t: "Castigar o culpado com dor física.", s: 0, i: {leg: 40, seg: 100, lib: 10}, f: "Falso. Isso seria tortura." },
                { t: "Arrecadar dinheiro para publicidade do governo.", s: 0, i: {leg: 20, seg: 20, lib: 50}, f: "Errado. Vai para a vítima." },
                { t: "Humilhar o devedor publicamente.", s: 0, i: {leg: 90, seg: 60, lib: 90}, f: "Incorreto. Veda-se a vingança pessoal." }
            ]}
        ];

        const shuffle = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        function App() {
            const [gameState, setGameState] = useState('intro-summary');
            const [introTimer, setIntroTimer] = useState(0);
            const [user, setUser] = useState({ name: '', class: '' });
            const [scenarios, setScenarios] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [metrics, setMetrics] = useState({ leg: 50, seg: 50, lib: 50 });
            const [feedback, setFeedback] = useState(null);
            const [timer, setTimer] = useState(60);
            const [chapterPopup, setChapterPopup] = useState(null);
            
            const hasSent = useRef(false);
            const stateRef = useRef({ score, metrics, user, gameState });

            useEffect(() => { 
                stateRef.current = { score, metrics, user, gameState }; 
            }, [score, metrics, user, gameState]);

            // Lógica de Envio de Emergência atualizada com fetch e keepalive
            useEffect(() => {
                const sendEmergencyData = () => {
                    if (hasSent.current || stateRef.current.gameState !== 'playing' || !stateRef.current.user.name) return;
                    
                    const finalGrade = (stateRef.current.score / 30 * 5).toFixed(1);
                    const payload = {
                        estudante: stateRef.current.user.name + " (FECHOU ABA/SAIU)",
                        turma: stateRef.current.user.class,
                        nota_final: finalGrade,
                        status: "Interrompido",
                        legitimidade: stateRef.current.metrics.leg.toFixed(0) + "%",
                        seguranca: stateRef.current.metrics.seg.toFixed(0) + "%",
                        liberdade: stateRef.current.metrics.lib.toFixed(0) + "%"
                    };

                    fetch(`https://formspree.io/f/xzdoopyw`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        keepalive: true
                    }).catch(console.error);

                    hasSent.current = true;
                };

                window.addEventListener('pagehide', sendEmergencyData);
                window.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'hidden') sendEmergencyData();
                });

                return () => {
                    window.removeEventListener('pagehide', sendEmergencyData);
                };
            }, []);

            useEffect(() => {
                let interval;
                if (gameState === 'intro-summary' || gameState === 'intro-rules') {
                    setIntroTimer(0);
                    interval = setInterval(() => setIntroTimer(v => v + 1), 1000);
                }
                return () => clearInterval(interval);
            }, [gameState]);

            const initScenarios = () => {
                let finalSet = [];
                for (let c = 1; c <= 5; c++) {
                    let chapterQuestions = RAW_SCENARIOS.filter(s => s.ch === c);
                    shuffle(chapterQuestions);
                    chapterQuestions = chapterQuestions.map(q => ({
                        ...q,
                        options: shuffle([...q.options])
                    }));
                    finalSet = [...finalSet, ...chapterQuestions];
                }
                setScenarios(finalSet);
                setGameState('playing');
                setChapterPopup(1);
            };

            useEffect(() => {
                if (gameState === 'playing' && !feedback && !chapterPopup) {
                    if (timer <= 0) { handleSelection(0, {leg:40, seg:40, lib:40}, "O tempo esgotou!"); return; }
                    const t = setInterval(() => setTimer(v => v - 1), 1000);
                    return () => clearInterval(t);
                }
            }, [gameState, timer, feedback, chapterPopup]);

            const handleSelection = (points, impacts, feedbackText) => {
                const newScore = score + points;
                const newMetrics = {
                    leg: Math.min(100, Math.max(0, metrics.leg + (impacts.leg - 50) / 4)),
                    seg: Math.min(100, Math.max(0, metrics.seg + (impacts.seg - 50) / 4)),
                    lib: Math.min(100, Math.max(0, metrics.lib + (impacts.lib - 50) / 4)),
                };
                setScore(newScore);
                setMetrics(newMetrics);
                setFeedback(feedbackText);
                setTimeout(() => {
                    setFeedback(null);
                    setTimer(60);
                    if (currentIdx < scenarios.length - 1) {
                        const nextIdx = currentIdx + 1;
                        if (scenarios[nextIdx].ch !== scenarios[currentIdx].ch) setChapterPopup(scenarios[nextIdx].ch);
                        setCurrentIdx(nextIdx);
                    } else { finishGame(newScore, newMetrics); }
                }, 3500);
            };

            const finishGame = async (fScore, fMetrics, status = "Concluído") => {
                if (hasSent.current) return;
                setGameState('sending');
                const finalGrade = (fScore / 30 * 5).toFixed(1);
                try {
                    await fetch(`https://formspree.io/f/xzdoopyw`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            estudante: user.name,
                            turma: user.class,
                            nota_final: finalGrade,
                            status: status,
                            legitimidade: fMetrics.leg.toFixed(0) + "%",
                            seguranca: fMetrics.seg.toFixed(0) + "%",
                            liberdade: fMetrics.lib.toFixed(0) + "%"
                        })
                    });
                    hasSent.current = true;
                } catch (e) { console.error(e); }
                setGameState('end');
            };

            // TELAS DE INTRODUÇÃO
            if (gameState === 'intro-summary') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-10 rounded-[40px] max-w-2xl w-full border-t-4 border-cyan-500 animate-fade text-center">
                        <h1 className="text-3xl font-black mb-6 text-white uppercase tracking-tighter">Resumo da Missão</h1>
                        <p className="text-lg text-slate-300 leading-relaxed mb-10 font-light">
                            Bem-vindo ao Simulador de Dilemas Jurídicos. Neste desafio, você é um <strong>consultor jurídico</strong> diante de situações reais e dilemas filosóficos que moldam a nossa sociedade. Ao longo de 5 capítulos, você enfrentará crises políticas, conflitos éticos e decisões judiciais complexas. Sua missão é aplicar o que foi estudado para encontrar a resposta que melhor equilibra a técnica jurídica, a justiça e a dignidade humana. Cada escolha define o peso da sua balança. Você está pronto para sustentar o Direito?
                        </p>
                        {introTimer >= 3 ? (
                            <button onClick={() => setGameState('intro-rules')} className="bg-cyan-600 hover:bg-cyan-500 px-12 py-5 rounded-2xl font-black text-sm tracking-widest shadow-xl transition-all">AVANÇAR</button>
                        ) : (
                            <div className="text-cyan-500 mono text-xs animate-pulse">AGUARDE... {3 - introTimer}s</div>
                        )}
                    </div>
                </div>
            );

            if (gameState === 'intro-rules') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-10 rounded-[40px] max-w-3xl w-full border-t-4 border-yellow-500 animate-fade overflow-y-auto max-h-[90vh]">
                        <h2 className="text-2xl font-black mb-6 text-white uppercase text-center">Regras do Jogo</h2>
                        <ul className="text-sm text-slate-300 space-y-4 font-light list-disc pl-6 mb-10">
                            <li><strong>Identificação:</strong> Antes de começar, insira seu nome completo e turma. Sem isso, sua participação não poderá ser computada.</li>
                            <li><strong>Tentativa Única:</strong> Você terá apenas uma tentativa. Caso o sistema registre mais de um acesso com o mesmo nome, será validada apenas a primeira pontuação.</li>
                            <li><strong>Temas:</strong> O jogo percorre os temas da 2ª etapa (Conceito de Direito, Moral, Ética, Justiça, Segurança, Liberdade, Poder e Sanção).</li>
                            <li><strong>Cronômetro:</strong> Você tem exatamente 60 segundos para responder a cada pergunta.</li>
                            <li><strong>Omissão:</strong> Se o tempo acabar, a pergunta ficará em branco (zero pontos) e o jogo passará automaticamente para a próxima.</li>
                            <li><strong>Internet:</strong> Certifique-se de estar em local estável. Quedas de sinal podem prejudicar seu tempo.</li>
                            <li><strong>Conclusão:</strong> A atividade só é considerada "concluída" quando você chegar ao final do último capítulo.</li>
                            <li><strong>Interrupção:</strong> Se você fechar o navegador ou desistir no meio, sua nota será proporcional ao seu desempenho até aquele momento.</li>
                            <li><strong>Estudo:</strong> Leia as justificativas (feedbacks) após cada resposta! Elas ajudam a fixar o conteúdo.</li>
                        </ul>
                        <div className="text-center">
                            {introTimer >= 10 ? (
                                <button onClick={() => setGameState('registration')} className="bg-yellow-600 hover:bg-yellow-500 px-12 py-5 rounded-2xl font-black text-sm tracking-widest shadow-xl transition-all">ENTENDI AS REGRAS</button>
                            ) : (
                                <div className="text-yellow-500 mono text-xs animate-pulse">LEIA ATENTAMENTE... {10 - introTimer}s</div>
                            )}
                        </div>
                    </div>
                </div>
            );

            if (gameState === 'registration') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-12 rounded-[40px] max-w-md w-full shadow-2xl text-center border-t-4 border-cyan-500 animate-fade">
                        <div className="w-20 h-20 bg-cyan-900/30 rounded-full mx-auto mb-6 flex items-center justify-center border-2 border-cyan-500">
                            <span className="text-3xl text-cyan-400">⚖️</span>
                        </div>
                        <h1 className="text-2xl font-black mb-8 tracking-tighter text-white uppercase">Identificação do Consultor Jurídico</h1>
                        <div className="space-y-3">
                            <input placeholder="NOME COMPLETO" className="w-full bg-black/40 p-4 rounded-2xl border border-white/10 outline-none focus:border-cyan-500 text-sm uppercase mono" onChange={e=>setUser({...user, name: e.target.value})} />
                            <input placeholder="TURMA" className="w-full bg-black/40 p-4 rounded-2xl border border-white/10 outline-none focus:border-cyan-500 text-sm uppercase mono" onChange={e=>setUser({...user, class: e.target.value})} />
                            <button onClick={()=>user.name && user.class && initScenarios()} className="w-full bg-cyan-600 hover:bg-cyan-500 p-5 rounded-2xl font-bold text-sm tracking-widest shadow-xl transition-all">INICIAR CONSULTORIA</button>
                        </div>
                    </div>
                </div>
            );

            if (gameState === 'sending') return (
                <div className="h-screen flex items-center justify-center flex-col gap-6 bg-slate-950">
                    <div className="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin"></div>
                    <div className="mono text-cyan-400 text-xs tracking-[0.4em] animate-pulse">PROTOCOLANDO RESULTADOS...</div>
                </div>
            );

            if (gameState === 'end') return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                    <div className="glass p-12 rounded-[50px] max-w-xl text-center border-t-8 border-green-500 animate-fade">
                        <h2 className="text-4xl font-black mb-6 text-white tracking-tighter uppercase">Laudo Final</h2>
                        <div className="grid grid-cols-3 gap-3 mb-8">
                            <StatCard label="Legitimidade" val={metrics.leg} color="text-blue-400" />
                            <StatCard label="Segurança" val={metrics.seg} color="text-yellow-400" />
                            <StatCard label="Liberdade" val={metrics.lib} color="text-green-400" />
                        </div>
                        <div className="p-10 bg-cyan-500/10 rounded-[40px] border border-cyan-500/30">
                            <div className="text-[10px] text-cyan-500 uppercase font-black tracking-widest mb-2">Nota Final</div>
                            <div className="text-8xl font-black text-white">{(score / 30 * 5).toFixed(1)}<span className="text-2xl opacity-20">/5.0</span></div>
                        </div>
                        <p className="mt-8 text-[10px] text-slate-500 mono uppercase tracking-widest">Consultor(a) {user.name} - Turma {user.class}</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col max-w-6xl mx-auto relative">
                    {chapterPopup && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/95 backdrop-blur-xl">
                            <div className="glass p-10 rounded-[45px] max-w-2xl w-full border-b-4 border-cyan-500 animate-fade text-center">
                                <span className="text-cyan-500 mono text-[10px] font-black tracking-widest uppercase mb-4 block">Capítulo {chapterPopup}</span>
                                <h2 className="text-3xl font-black text-white mb-6 uppercase">{CHAPTER_INTRO[chapterPopup].title}</h2>
                                <p className="text-lg text-slate-300 leading-relaxed mb-10 italic">"{CHAPTER_INTRO[chapterPopup].context}"</p>
                                <button onClick={() => setChapterPopup(null)} className="bg-white text-black px-10 py-5 rounded-2xl font-black text-sm tracking-widest hover:bg-cyan-400 transition-all uppercase">Acessar Gabinete</button>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-3 mb-8">
                        <MetricBar label="Legitimidade" val={metrics.leg} color="bg-blue-500" />
                        <MetricBar label="Segurança" val={metrics.seg} color="bg-yellow-500" />
                        <MetricBar label="Liberdade" val={metrics.lib} color="bg-green-500" />
                    </div>

                    {scenarios[currentIdx] && (
                        <div className="flex-1 grid lg:grid-cols-12 gap-8 items-stretch">
                            <div className="glass p-8 md:p-12 rounded-[40px] lg:col-span-8 flex flex-col shadow-2xl relative overflow-hidden">
                                <div className="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                                    <div>
                                        <span className="bg-cyan-500 text-black text-[9px] px-3 py-1 rounded-full font-black uppercase tracking-widest mr-2">Capítulo {scenarios[currentIdx].ch}</span>
                                        <span className="text-white/40 text-[9px] uppercase mono">Dilema {currentIdx + 1}/{scenarios.length}</span>
                                        <h3 className="text-xl font-black text-white mt-2 tracking-tight uppercase italic">{scenarios[currentIdx].title}</h3>
                                    </div>
                                    <div className={`text-4xl font-black mono ${timer < 10 ? 'text-red-500 animate-pulse' : 'text-slate-800'}`}>{timer}s</div>
                                </div>
                                <p className="text-lg text-slate-300 leading-relaxed mb-12 font-light">{scenarios[currentIdx].text}</p>
                                <div className="grid gap-3 mt-auto">
                                    {scenarios[currentIdx].options.map((opt, i) => (
                                        <button key={i} disabled={!!feedback || !!chapterPopup} onClick={() => handleSelection(opt.s, opt.i, opt.f)}
                                            className="text-left p-5 rounded-2xl border border-white/10 bg-white/5 hover:bg-cyan-500/10 hover:border-cyan-500 transition-all group flex items-center disabled:opacity-50">
                                            <span className="w-10 h-10 rounded-xl bg-black flex items-center justify-center mr-6 text-cyan-500 font-black group-hover:bg-cyan-500 group-hover:text-white transition-all">{String.fromCharCode(65+i)}</span>
                                            <span className="flex-1 text-sm font-bold text-slate-200">{opt.t}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="lg:col-span-4 flex flex-col items-center justify-center gap-6">
                                <div className="w-full glass p-6 rounded-[35px] border-l-4 border-cyan-500">
                                    <p className="text-[10px] text-slate-500 uppercase font-black mb-2 tracking-widest">Gabinete de Consultoria</p>
                                    <p className="text-sm font-bold text-white uppercase truncate">{user.name}</p>
                                    <div className="mt-4 h-1 bg-white/10 rounded-full overflow-hidden">
                                        <div className="h-full bg-cyan-500 rounded-full transition-all" style={{width: `${(currentIdx/30)*100}%`}}></div>
                                    </div>
                                    <button 
                                        onClick={() => confirm("Deseja emitir o laudo parcial agora e encerrar?") && finishGame(score, metrics, "Desistência")}
                                        className="mt-6 w-full py-2 rounded-xl text-[10px] font-black tracking-widest border border-red-500/30 text-red-500 hover:bg-red-500 hover:text-white transition-all uppercase"
                                    >
                                        Desistir / Sair
                                    </button>
                                </div>
                                <div className="flex flex-col items-center min-h-[300px] justify-end">
                                    {feedback && <div className="speech-bubble mb-6 animate-fade">{feedback}</div>}
                                    <div className="relative">
                                        <img src={PROFESSORA_IMAGE} className="prof-avatar shadow-[0_0_40px_rgba(6,182,212,0.3)]" />
                                        <div className="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-4 border-slate-900 rounded-full"></div>
                                    </div>
                                    <p className="mt-4 text-[10px] font-black text-cyan-500 uppercase tracking-[0.3em]">Prof. Siomara</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function MetricBar({ label, val, color }) {
            return (
                <div className="glass p-5 rounded-[25px]">
                    <div className="flex justify-between text-[9px] uppercase font-black tracking-widest mb-3 opacity-50">
                        <span>{label}</span>
                        <span className="mono">{val.toFixed(0)}%</span>
                    </div>
                    <div className="h-1 bg-white/5 rounded-full overflow-hidden">
                        <div className={`h-full ${color} bar-transition`} style={{ width: `${val}%` }}></div>
                    </div>
                </div>
            );
        }

        function StatCard({ label, val, color }) {
            return (
                <div className="p-4 bg-white/5 rounded-3xl border border-white/5">
                    <div className="text-[9px] text-slate-500 uppercase mb-1 font-bold">{label}</div>
                    <div className={`text-2xl font-black ${color}`}>{val.toFixed(0)}%</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // CONFIGURAÇÕES
        const FORMSPREE_ID = "xzdoopyw"; 
        // Link RAW extraído do seu repositório para funcionar no HTML:
        const PROFESSORA_IMAGE = "https://raw.githubusercontent.com/simscreiando/philosophy.prof_siomara/72cd32ed88c92ff78ec2785c4779aacd652d6230/professora.png";

       // CAPÍTULO 1: O DIREITO COMO OBJETO CULTURAL (PAULO NADER)
        const CAP_1_SEGMENTOS = [
            { ch: 1, seg: 1, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Após conflitos sociais sucessivos, grupos políticos passaram a defender que o Direito apenas limita impulsos naturais humanos e que a sociedade deveria organizar-se pela lógica espontânea da força e da sobrevivência. O Tribunal solicita parecer filosófico.", options: [
                { t: "O Direito existe para transformar impulsos naturais em convivência social orientada por valores éticos.", s: 0.16, i: {leg: 100, seg: 80, lib: 70}, f: "A alternativa compreende corretamente o Direito como objeto cultural destinado à organização racional da convivência humana." },
                { t: "A prevalência natural dos mais fortes constitui fundamento legítimo da ordem jurídica.", s: 0, i: {leg: 30, seg: 50, lib: 20}, f: "A resposta aproxima o Direito de relações puramente biológicas de dominação, afastando sua dimensão ética." },
                { t: "O Direito deve apenas registrar práticas sociais já existentes, sem transformá-las.", s: 0.05, i: {leg: 40, seg: 90, lib: 10}, f: "A alternativa reconhece a influência social sobre o Direito, mas reduz excessivamente sua função normativa." },
                { t: "Toda forma de regulamentação jurídica compromete necessariamente a liberdade humana.", s: 0, i: {leg: 50, seg: 30, lib: 60}, f: "A resposta ignora que a ausência de normatividade tende a ampliar arbitrariedades e instabilidade social." }
            ]},
            { ch: 1, seg: 2, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "O governo instituiu normas inspiradas em modelos estrangeiros sem considerar costumes locais historicamente consolidados. Em pouco tempo, cresceram resistência social e descumprimento coletivo das regras impostas.", options: [
                { t: "A eficácia jurídica decorre exclusivamente da capacidade estatal de aplicar sanções.", s: 0, i: {leg: 20, seg: 10, lib: 30}, f: "A resposta reduz o Direito à coerção, ignorando fatores sociais de legitimidade normativa." },
                { t: "A legitimidade do Direito também depende de diálogo com valores culturais compartilhados.", s: 0.16, i: {leg: 100, seg: 70, lib: 80}, f: "A alternativa reconhece adequadamente a dimensão histórica e cultural da experiência jurídica." },
                { t: "O Direito pode promover mudanças sociais, mas não pode ignorar completamente os valores coletivos.", s: 0.05, i: {leg: 40, seg: 90, lib: 10}, f: "A resposta demonstra compreensão razoável do caráter dinâmico da ordem jurídica." },
                { t: "A cultura popular deve ser ignorada sempre que dificultar reformas institucionais modernas.", s: 0, i: {leg: 10, seg: 40, lib: 10}, f: "A alternativa compromete a legitimidade democrática e despreza a historicidade do Direito." }
            ]},
            { ch: 1, seg: 3, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Se uma lei jurídica é violada, ela perde sua validade? Como Nader caracteriza essa situação frente às leis da natureza?", options: [
                { t: "Sim, pois no 'Dever-Ser' a validade da norma depende do seu cumprimento absoluto por todos.", s: 0, i: {leg: 50, seg: 10, lib: 80}, f: "Incorreto. A validade da norma jurídica é independente da sua violação eventual." },
                { t: "Não. A violação apenas aciona a sanção, pois o Direito opera no campo da liberdade e do valor.", s: 0.16, i: {leg: 90, seg: 100, lib: 70}, f: "Brilhante! Diferente da lei física, a norma jurídica admite ser violada sem deixar de existir." },
                { t: "A lei jurídica, se violada, torna-se uma lei física de causa e efeito imediato.", s: 0.05, i: {leg: 30, seg: 90, lib: 20}, f: "A sanção não é um efeito físico mecânico, mas uma consequência jurídica prescrita." },
                { t: "A lei jurídica perde a validade se um único indivíduo decidir não obedecê-la.", s: 0, i: {leg: 20, seg: 10, lib: 100}, f: "Isso anularia o Direito. A norma é imperativa e resiste à transgressão." }
            ]},
            { ch: 1, seg: 4, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Durante audiência pública, um representante afirmou que normas jurídicas funcionam exatamente como leis físicas da natureza, operando de modo automático e inevitável, independentemente de escolhas humanas.", options: [
                { t: "Normas jurídicas e leis naturais possuem a mesma estrutura mecânica e inevitável.", s: 0, i: {leg: 10, seg: 100, lib: 10}, f: "A resposta elimina a dimensão ética e volitiva própria do fenômeno jurídico." },
                { t: "As normas jurídicas pertencem ao campo do dever-ser e pressupõem liberdade e valoração ética.", s: 0.16, i: {leg: 100, seg: 60, lib: 90}, f: "Correto! A alternativa distingue corretamente causalidade natural e normatividade jurídica." },
                { t: "Embora influenciado pela realidade social, o Direito não se reduz a relações automáticas de causa e efeito.", s: 0.05, i: {leg: 40, seg: 80, lib: 40}, f: "A alternativa apresenta compreensão parcial da diferença entre natureza e normatividade." },
                { t: "A função do Direito consiste apenas em prever comportamentos humanos recorrentes.", s: 0, i: {leg: 10, seg: 90, lib: 0}, f: "A resposta aproxima o Direito de uma leitura puramente sociológica e desprovida de axiologia." }
            ]},
            { ch: 1, seg: 5, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Durante reforma legislativa, surge debate sobre a inclusão de princípios éticos universais no texto constitucional. O Parlamento discute se o Direito deve refletir apenas vontades sociais momentâneas ou também fundamentos permanentes ligados à dignidade e à liberdade humana.", options: [
                { t: "O Direito Natural constitui sistema absoluto e imutável de regras religiosas que impede qualquer adaptação histórica do Direito Positivo.", s: 0.05, i: {leg: 60, seg: 100, lib: 10}, f: "A alternativa reconhece parcialmente a ideia de permanência axiológica, mas reduz o Direito Natural a um modelo rígido e incompatível com a historicidade da experiência jurídica." },
                { t: "Direito Natural e Direito Positivo constituem ordens idênticas, inexistindo qualquer margem interpretativa ou função criadora do legislador.", s: 0.05, i: {leg: 100, seg: 70, lib: 80}, f: "A alternativa reconhece a aproximação entre Direito Natural e Direito Positivo, mas elimina indevidamente a dimensão histórica e técnica da atividade legislativa." },
                { t: "Princípios como liberdade e preservação da vida dependem exclusivamente da vontade política de cada época histórica.", s: 0, i: {leg: 40, seg: 10, lib: 100}, f: "A resposta ignora o caráter universal atribuído aos princípios fundamentais do Direito Natural." },
                { t: "A ordem jurídica deve articular realidade social e princípios universais do Direito Natural, como vida e liberdade, orientando o legislador na construção de normas justas.", s: 0.16, i: {leg: 30, seg: 50, lib: 40}, f: "A alternativa compreende adequadamente a posição de Paulo Nader. O Direito Natural atua como fundamento axiológico orientador da produção normativa positiva." }
            ]},
            { ch: 1, seg: 6, title: "CONCEITO DE DIREITO E ORDENAMENTO JURÍDICO", text: "Um cidadão é processado por conduta moralmente reprovável, mas sem previsão legal clara de sanção. A defesa sustenta que o Direito exige previsibilidade normativa e tipificação objetiva para legitimar o exercício do poder estatal.", options: [
                { t: "O Direito exige predeterminação formal mínima, tipificação e previsibilidade normativa, permitindo ao indivíduo conhecer previamente as consequências jurídicas de sua conduta.", s: 0.20, i: {leg: 50, seg: 100, lib: 10}, f: "A alternativa compreende corretamente a relação entre bilateralidade atributiva, certeza jurídica e predeterminação formal na teoria de Miguel Reale." },
                { t: "A lei deve refletir os valores da sociedade para ter eficácia e cumprir seu papel adaptativo.", s: 0.05, i: {leg: 100, seg: 80, lib: 90}, f: "Perfeito! A coerência com os valores sociais é o que garante a vida do Direito." },
                { t: "A certeza jurídica impede qualquer atividade interpretativa do Poder Judiciário além da literalidade da norma.", s: 0, i: {leg: 40, seg: 90, lib: 20}, f: "A alternativa reconhece a importância da previsibilidade normativa, mas reduz excessivamente a função interpretativa da jurisdição." },
                { t: "Sistemas jurídicos baseados em costumes não possuem segurança normativa nem critérios formais de juridicidade.", s: 0, i: {leg: 10, seg: 100, lib: 10}, f: "A resposta ignora que diferentes tradições jurídicas podem desenvolver mecanismos próprios de estabilidade e reconhecimento normativo." }
            ]}
        ];
        // CAPÍTULO 2: DIREITO, MORAL E ÉTICA (REALE, BITTAR E MASCARO)
        const CAP_2_SEGMENTOS = [
            { ch: 2, seg: 1, title: "DIREITO, MORAL E ÉTICA", text: "Na crise, muitos cumprem normas por receio de punição, embora discordem delas. O Tribunal pede análise sobre a relação entre Direito e Moral.", options: [
                { t: "O Direito pode exigir comportamentos externos independente da adesão moral interna do indivíduo.", s: 0.5, i: {leg: 100, seg: 90, lib: 60}, f: "Excelente! Você compreendeu a coercibilidade e a distinção entre foro íntimo e comportamento exigível." },
                { t: "Normas jurídicas somente são legítimas quando coincidem integralmente com convicções morais individuais.", s: 0.1, i: {leg: 30, seg: 20, lib: 100}, f: "Cuidado. Isso reduziria a autonomia do Direito diante da pluralidade moral da sociedade." },
                { t: "Direito e Moral possuem exatamente a mesma estrutura coercitiva e mecanismos de imposição.", s: 0, i: {leg: 10, seg: 10, lib: 10}, f: "Incorreto. A alternativa ignora a diferença entre coerção estatal e adesão moral espontânea." },
                { t: "O Direito atua prioritariamente sobre relações externas, enquanto a Moral foca na consciência.", s: 0.3, i: {leg: 80, seg: 70, lib: 50}, f: "Boa análise, embora menos profunda sobre as diferenças estruturais entre as normas." }
            ]},
            { ch: 2, seg: 2, title: "DIREITO, MORAL E ÉTICA", text: "Políticos defendem que normas sem aplicação imediata da força não são jurídicas. Qual o parecer correto sobre a coercibilidade do Direito?", options: [
                { t: "A coercibilidade jurídica depende necessariamente da aplicação física imediata da força estatal.", s: 0.1, i: {leg: 40, seg: 100, lib: 10}, f: "Não. Isso reduz o Direito à violência material, ignorando sua dimensão institucional potencial." },
                { t: "A coercibilidade é a possibilidade legítima de imposição pela força, ainda que não usada concretamente.", s: 0.5, i: {leg: 90, seg: 100, lib: 70}, f: "Perfeito! A coercibilidade é um elemento potencial e estruturante da juridicidade." },
                { t: "A existência de sanções transforma automaticamente qualquer regra moral em norma jurídica.", s: 0, i: {leg: 20, seg: 50, lib: 30}, f: "Errado. A juridicidade exige institucionalização normativa e reconhecimento pelo Estado." },
                { t: "A força estatal é importante, mas insuficiente para explicar integralmente a experiência jurídica.", s: 0.3, i: {leg: 70, seg: 60, lib: 80}, f: "Correto, você reconheceu os limites da coerção como fundamento exclusivo do sistema." }
            ]},
            { ch: 2, seg: 3, title: "DIREITO, MORAL E ÉTICA", text: "Debate: Ética seria o social e Moral a reflexão. O Direito seria extensão da Moral. Qual a distinção correta segundo Bittar e Mascaro?", options: [
                { t: "A Moral corresponde às práticas sociais vividas, enquanto a Ética realiza a reflexão crítica.", s: 0.5, i: {leg: 100, seg: 60, lib: 90}, f: "Exato! Você captou a distinção filosófica clássica trabalhada por Bittar e Mascaro." },
                { t: "Ética e Moral são expressões rigorosamente idênticas, sem qualquer distinção conceitual.", s: 0.1, i: {leg: 30, seg: 30, lib: 30}, f: "Atenção. A resposta ignora a distinção entre a prática moral e a reflexão ética crítica." },
                { t: "O Direito constitui simples subcategoria da Moral, sem autonomia histórica ou institucional.", s: 0, i: {leg: 10, seg: 10, lib: 10}, f: "Incorreto. Isso elimina a especificidade política e institucional do fenômeno jurídico." },
                { t: "O Direito mantém diálogo com a Moral, mas possui estruturas próprias de normatividade e coação.", s: 0.3, i: {leg: 80, seg: 80, lib: 70}, f: "Correto. O Direito possui uma autonomia relativa frente às demais regulações sociais." }
            ]},
            { ch: 2, seg: 4, title: "DIREITO, MORAL E ÉTICA", text: "Um jurista justifica atos abusivos alegando apenas cumprir ordens. Como a ética de Bittar avalia essa postura?", options: [
                { t: "O exercício profissional do Direito exige responsabilidade ética pelos impactos sociais das decisões.", s: 0.5, i: {leg: 100, seg: 50, lib: 100}, f: "Muito bem! Bittar destaca o compromisso ético-social inafastável do operador jurídico." },
                { t: "O jurista deve preocupar-se exclusivamente com resultados técnicos e estratégicos do sistema.", s: 0, i: {leg: 20, seg: 100, lib: 10}, f: "Péssimo. Essa visão ignora a dimensão humana e ética inerente à atuação jurídica." },
                { t: "A responsabilidade ética existe apenas quando houver violação explícita da legislação positiva.", s: 0.1, i: {leg: 50, seg: 70, lib: 40}, f: "Cuidado. Isso reduz a ética profissional ao mero cumprimento formal da legalidade." },
                { t: "Decisões jurídicas interferem diretamente na vida social, política e axiológica da coletividade.", s: 0.3, i: {leg: 80, seg: 60, lib: 80}, f: "Correto. Você reconheceu a dimensão interventiva e o peso das práticas jurídicas." }
            ]},
            { ch: 2, seg: 5, title: "DIREITO, MORAL E ÉTICA", text: "Empresa demite funcionário por ato imoral, mas juridicamente lícito. Qual a relação entre os campos segundo Miguel Reale?", options: [
                { t: "A teoria do mínimo ético diz que toda regra moral relevante vira automaticamente obrigação jurídica.", s: 0.1, i: {leg: 60, seg: 80, lib: 40}, f: "Incompleto. Isso elimina indevidamente a autonomia estrutural do fenômeno jurídico." },
                { t: "O Direito absorve a moralidade social, não havendo distinção entre ilícito jurídico e reprovação ética.", s: 0, i: {leg: 10, seg: 50, lib: 10}, f: "Errado. Reale defende que são campos distintos com estruturas de sanção diversas." },
                { t: "Nem toda reprovação moral produz consequência jurídica, pois os campos possuem autonomia relativa.", s: 0.5, i: {leg: 100, seg: 70, lib: 80}, f: "Perfeito! Você compreendeu a crítica ao mínimo ético e a autonomia na teoria de Reale." },
                { t: "A empresa pode impor qualquer dever de foro íntimo se houver previsão em regulamento interno.", s: 0.3, i: {leg: 70, seg: 90, lib: 30}, f: "Parcialmente correto, mas amplia demais o alcance do Direito sobre a esfera íntima." }
            ]},
            { ch: 2, seg: 6, title: "DIREITO, MORAL E ÉTICA", text: "Movimentos defendem o Direito como arma de cidadania. Qual a função transformadora destacada por Bittar e Mascaro?", options: [
                { t: "O Direito pode atuar como instrumento de transformação social comprometido com a justiça.", s: 0.5, i: {leg: 100, seg: 50, lib: 100}, f: "Excelente! Você captou a função social e democrática defendida pelos autores." },
                { t: "O Direito deve limitar-se à preservação técnica da ordem vigente, sem preocupações sociais.", s: 0, i: {leg: 40, seg: 100, lib: 10}, f: "Incorreto. Isso reduz o Direito à mera manutenção formal do poder instituído." },
                { t: "Questões éticas e sociais pertencem exclusivamente à política, não ao campo jurídico.", s: 0.1, i: {leg: 20, seg: 20, lib: 50}, f: "Não. A teoria contemporânea reconhece a intensa interação entre esses campos." },
                { t: "A experiência jurídica envolve permanente diálogo entre normas, valores e história.", s: 0.3, i: {leg: 90, seg: 60, lib: 90}, f: "Correto. Uma visão equilibrada sobre a complexidade axiológica do Direito." }
            ]}
        ];
        // CAPÍTULO 3: DIREITO, JUSTIÇA E SEGURANÇA JURÍDICA
        const CAP_3_SEGMENTOS = [
            { ch: 3, seg: 1, title: "Justiça Material", text: "Uma decisão legal causou grave desigualdade social. O debate questiona se a conformidade à lei basta para caracterizar a verdadeira justiça.", options: [
                { t: "A legalidade somente preserva legitimidade quando compatível com critérios materiais de justiça.", s: 0.5, i: {leg: 100, seg: 60, lib: 90}, f: "Excelente! Você compreendeu a tensão entre validade formal e justiça material." },
                { t: "A Justiça corresponde exclusivamente ao cumprimento literal da legislação positiva.", s: 0, i: {leg: 50, seg: 100, lib: 10}, f: "Incorreto. Isso reduz o Direito ao formalismo, ignorando sua dimensão axiológica." },
                { t: "A estabilidade institucional justifica limitações excepcionais à justiça social.", s: 0.1, i: {leg: 70, seg: 90, lib: 30}, f: "Atenção. Você valorizou demais a ordem em detrimento da realização do justo." },
                { t: "A interpretação exige equilíbrio entre segurança normativa e realização da justiça.", s: 0.3, i: {leg: 80, seg: 70, lib: 80}, f: "Boa resposta. Demonstra compreensão da complexidade interpretativa contemporânea." }
            ]},
            { ch: 3, seg: 2, title: "Justiça Distributiva", text: "Em crise econômica, o governo debate como dividir recursos escassos entre grupos desiguais. Qual o critério da justiça distributiva?", options: [
                { t: "A justiça distributiva exige tratar desigualmente os desiguais na medida de suas diferenças.", s: 0.5, i: {leg: 90, seg: 70, lib: 100}, f: "Perfeito! Você aplicou corretamente a tradição aristotélica retomada por Bittar." },
                { t: "A igualdade jurídica exige distribuição idêntica de recursos para todos os grupos.", s: 0.1, i: {leg: 60, seg: 50, lib: 60}, f: "Cuidado. Você confundiu igualdade formal (letra da lei) com justiça material." },
                { t: "A distribuição deve obedecer exclusivamente aos interesses econômicos do Estado.", s: 0, i: {leg: 20, seg: 100, lib: 10}, f: "Errado. A alternativa ignora a finalidade ética e social das políticas públicas." },
                { t: "A justiça social depende da consideração das desigualdades historicamente produzidas.", s: 0.3, i: {leg: 80, seg: 60, lib: 90}, f: "Correto. Você reconheceu a dimensão histórica necessária à justiça distributiva." }
            ]},
            { ch: 3, seg: 3, title: "Segurança Jurídica", text: "Mudanças jurisprudenciais contraditórias geram insegurança. O que os cidadãos podem exigir do sistema judiciário?", options: [
                { t: "A segurança jurídica exige estabilidade interpretativa mínima e previsibilidade das normas.", s: 0.5, i: {leg: 100, seg: 100, lib: 70}, f: "Exato! A segurança jurídica preserva a confiança social nas instituições." },
                { t: "A busca pela justiça autoriza alterações imprevisíveis e constantes das decisões.", s: 0.1, i: {leg: 30, seg: 20, lib: 100}, f: "Risco alto. Isso sacrifica a estabilidade institucional em nome de um ideal volátil." },
                { t: "A segurança jurídica impede qualquer atualização interpretativa das normas pelo juiz.", s: 0.3, i: {leg: 70, seg: 90, lib: 40}, f: "Parcialmente correto, mas o Direito precisa de uma dinâmica mínima para evoluir." },
                { t: "A previsibilidade jurídica possui relevância secundária diante dos interesses do Estado.", s: 0, i: {leg: 10, seg: 100, lib: 0}, f: "Incorreto. Isso compromete a confiança necessária à ordem democrática." }
            ]},
            { ch: 3, seg: 4, title: "Dignidade Humana", text: "Corte de gastos em presídios impede assistência médica básica. O debate questiona os limites da pena e da dignidade humana.", options: [
                { t: "A dignidade impede que a pena produza condições degradantes além da privação de liberdade.", s: 0.5, i: {leg: 100, seg: 50, lib: 100}, f: "Perfeito! A dignidade humana é o limite intransponível do poder punitivo estatal." },
                { t: "A estabilidade financeira do Estado justifica restrições aos direitos fundamentais de presos.", s: 0.1, i: {leg: 40, seg: 90, lib: 20}, f: "Errado. Direitos fundamentais não podem ser subordinaos a critérios econômicos." },
                { t: "O sofrimento adicional nas prisões integra legitimamente a finalidade pedagógica da pena.", s: 0, i: {leg: 10, seg: 80, lib: 0}, f: "Inaceitável. Isso viola os limites constitucionais e humanos do exercício do poder." },
                { t: "A proteção da dignidade depende de critérios morais e não de deveres jurídicos objetivos.", s: 0.3, i: {leg: 70, seg: 40, lib: 80}, f: "Atenção. Embora tenha base ética, a dignidade é um dever jurídico concreto." }

                    return () => clearInterval(t);
                }

                    leg: Math.min(100, Math.max(0, metrics.leg + (impacts.leg - 50) / 4)),
                    seg: Math.min(100, Math.max(0, metrics.seg + (impacts.seg - 50) / 4)),
                    lib: Math.min(100, Math.max(0, metrics.lib + (impacts.lib - 50) / 4)),
                };

                setMetrics(newMetrics);
                setFeedback(feedbackText);

                    setFeedback(null);
                    setTimer(60);
                    if (currentIdx < ALL_SCENARIOS.length - 1) {
                        setCurrentIdx(i => i + 1);
                    } else {
                        finishGame(newScore, newMetrics);
                    }
                }, 4000);

                    estudante: user.name,
                    turma: user.class,

                    legitimidade: finalMetrics.leg.toFixed(0) + "%",
                    seguranca: finalMetrics.seg.toFixed(0) + "%",
                    liberdade: finalMetrics.lib.toFixed(0) + "%"
                };

                    await fetch(`https://formspree.io/f/xzdoopyw`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) { console.error(e); }
                setGameState('end');

                            <input placeholder="TURMA" className="w-full bg-black/40 p-4 rounded-2xl border border-white/10 outline-none focus:border-cyan-500 transition-all text-sm uppercase mono" onChange={e=>setUser({...user, class: e.target.value})} />

                        </div>
                    </div>

                        </div>

                            <p className="text-xl text-slate-300 leading-relaxed mb-12 font-light">{current.text}</p>

                            <div className="grid gap-4 mt-auto">
                                {current.options.map((opt, i) => (
                                    <button key={i} disabled={!!feedback} onClick={() => handleSelection(opt.s, opt.i, opt.f)}
                                        className="text-left p-6 rounded-3xl border border-white/10 bg-white/5 hover:bg-cyan-500/10 hover:border-cyan-500 transition-all group flex items-center disabled:opacity-50">
                                        <span className="w-12 h-12 rounded-2xl bg-black flex items-center justify-center mr-6 text-cyan-500 font-black group-hover:bg-cyan-500 group-hover:text-white transition-all">{String.fromCharCode(65+i)}</span>
                                        <span className="flex-1 text-base font-bold text-slate-200">{opt.t}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="lg:col-span-4 flex flex-col items-center justify-center gap-6">
                            <div className="w-full glass p-6 rounded-[35px] border-l-4 border-cyan-500">
                                <p className="text-[10px] text-slate-500 uppercase font-black mb-2 tracking-widest">Sessão Ativa</p>
                                <p className="text-sm font-bold text-white uppercase">{user.name}</p>
                                <div className="mt-4 h-1 bg-white/10 rounded-full">
                                    <div className="h-full bg-cyan-500 rounded-full transition-all" style={{width: `${(currentIdx/ALL_SCENARIOS.length)*100}%`}}></div>
                                </div>
                            </div>

                            <div className="flex flex-col items-center min-h-[300px] justify-end">
                                {feedback && (
                                    <div className="speech-bubble mb-6 animate-pop">
                                        {feedback}
                                    </div>
                                )}
                                <div className="relative">
                                    <img src={PROFESSORA_IMAGE} alt="Professora" className="prof-avatar shadow-[0_0_40px_rgba(6,182,212,0.3)]" 
                                         onError={(e) => { e.target.src = "https://cdn-icons-png.flaticon.com/512/1998/1998614.png"; }} />
                                    <div className="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-4 border-slate-900 rounded-full"></div>
                                </div>
                                <p className="mt-4 text-[10px] font-black text-cyan-500 uppercase tracking-[0.3em]">Prof. Siomara</p>
                                <p className="text-[9px] text-slate-500 italic">Orientadora da Simulação</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MetricBar({ label, val, color }) {
            return (
                <div className="glass p-5 rounded-[25px] border-b-2 border-white/5">
                    <div className="flex justify-between text-[9px] uppercase font-black tracking-widest mb-3 opacity-50">
                        <span>{label}</span>
                        <span className="mono">{val.toFixed(0)}%</span>
                    </div>
                    <div className="h-1 bg-white/5 rounded-full overflow-hidden">
                        <div className={`h-full ${color} bar-transition`} style={{ width: `${val}%` }}></div>
                    </div>
                </div>
            );
        }

        function StatCard({ label, val, color }) {
            return (
                <div className="p-4 bg-white/5 rounded-3xl border border-white/5">
                    <div className="text-[9px] text-slate-500 uppercase mb-1 font-bold tracking-tighter">{label}</div>
                    <div className={`text-2xl font-black ${color}`}>{val.toFixed(0)}%</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
